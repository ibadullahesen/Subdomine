<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qızılı Səs Dalğası - Maksimum Parlaqlıq və Ölçü</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030303;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam {
            display: none;
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands və Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <video id="webcam" playsinline></video>

    <script>
        let scene, camera, renderer, particles, particleGeometry, particleMaterial;
        const particleCount = 28000; // Zərrəcik sayı daha da artırıldı
        let positions, originalDirections, baseRadii, speeds, phases;
        
        let handPosition = new THREE.Vector3(0, 0, 0);
        let targetHandPosition = new THREE.Vector3(0, 0, 0);
        
        let isFist = false;
        let scatterAmount = 0.0;
        let targetScatter = 0.0;
        
        let fistScale = 0.6;
        let targetFistScale = 0.6;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            particleGeometry = new THREE.BufferGeometry();
            positions = new Float32Array(particleCount * 3);
            originalDirections = new Float32Array(particleCount * 3);
            baseRadii = new Float32Array(particleCount);
            speeds = new Float32Array(particleCount);
            phases = new Float32Array(particleCount);

            const colors = new Float32Array(particleCount * 3);
            const colorObj = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;

                const wave = Math.sin(theta * 12) * Math.cos(phi * 10) * 0.22;
                const radius = 1.2 + wave;

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                baseRadii[i] = radius;

                const u = Math.random();
                const v = Math.random();
                const thetaRand = u * 2.0 * Math.PI;
                const phiRand = Math.acos(2.0 * v - 1.0);
                const rRand = 0.8 + Math.random() * 3.5; // Genişlənmə diapazonu artırıldı

                originalDirections[i * 3] = rRand * Math.sin(phiRand) * Math.cos(thetaRand);
                originalDirections[i * 3 + 1] = rRand * Math.sin(phiRand) * Math.sin(thetaRand);
                originalDirections[i * 3 + 2] = rRand * Math.cos(phiRand);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                speeds[i] = 0.5 + Math.random() * 1.5;
                phases[i] = Math.random() * Math.PI * 2;

                colorObj.setHSL(0.12, 0.9, 0.5 + Math.random() * 0.5);
                colors[i * 3] = colorObj.r;
                colors[i * 3 + 1] = colorObj.g;
                colors[i * 3 + 2] = colorObj.b;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvasTex = createParticleTexture();
            const texture = new THREE.CanvasTexture(canvasTex);

            particleMaterial = new THREE.PointsMaterial({
                size: 0.05,
                map: texture,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
            initMediaPipe();
            animate();
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,230,100,1)');
            gradient.addColorStop(0.5, 'rgba(255,215,0,0.9)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return canvas;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function initMediaPipe() {
            const videoElement = document.getElementById('webcam');
            
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const wrist = landmarks[0];
                const middleMCP = landmarks[9];
                
                const x = -((wrist.x + middleMCP.x) / 2 - 0.5) * 5;
                const y = -((wrist.y + middleMCP.y) / 2 - 0.5) * 4;
                targetHandPosition.set(x, y, 0);

                let totalSpread = 0;
                [8, 12, 16, 20].forEach(tipIdx => {
                    const tip = landmarks[tipIdx];
                    const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                    totalSpread += dist;
                });
                totalSpread /= 4;
                
                // Əl açıldıqda çox nəhəng şəkildə böyüyüb dağılması üçün əmsal qat-qat artırıldı
                targetScatter = Math.max(0, (totalSpread - 0.3) * 16.0);

                let avgDistanceToWrist = 0;
                [8, 12, 16, 20].forEach(tipIdx => {
                    const tip = landmarks[tipIdx];
                    const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                    avgDistanceToWrist += dist;
                });
                avgDistanceToWrist /= 4;
                isFist = avgDistanceToWrist < 0.28;

                if (isFist) {
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                    targetFistScale = 0.2 + (pinchDist * 4.0);
                }
            } else {
                targetHandPosition.set(0, 0, 0);
                targetScatter = 0.0;
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            handPosition.lerp(targetHandPosition, 0.08);
            scatterAmount += (targetScatter - scatterAmount) * 0.06;
            fistScale += (targetFistScale - fistScale) * 0.12;

            particles.position.copy(handPosition);
            particles.rotation.y = elapsedTime * 0.12;
            particles.rotation.x = Math.sin(elapsedTime * 0.06) * 0.08;

            const posAttribute = particleGeometry.attributes.position;

            // Yumruq və ya açıq əl zamanı parlaqlıq maksimum səviyyəyə qaldırıldı
            let targetOpacity = isFist ? 1.0 : 0.95;
            particleMaterial.opacity += (targetOpacity - particleMaterial.opacity) * 0.15;

            // Ölçü çox böyüdüldü (həm yumruqda, həm də səpələnəndə parlaq və iri görünməsi üçün)
            let targetSize = isFist ? 0.08 : (0.05 + scatterAmount * 0.012);
            particleMaterial.size += (targetSize - particleMaterial.size) * 0.15;

            for (let i = 0; i < particleCount; i++) {
                const origX = originalDirections[i * 3];
                const origY = originalDirections[i * 3 + 1];
                const origZ = originalDirections[i * 3 + 2];
                const baseR = baseRadii[i];
                const pSpeed = speeds[i];
                const pPhase = phases[i];

                let tx, ty, tz;

                const waveAnim = Math.sin(elapsedTime * 4.0 + pPhase) * 0.1;

                if (isFist) {
                    const compactWave = Math.sin(elapsedTime * 6 + pPhase) * 0.02;
                    const r = baseR * (fistScale + compactWave);
                    const phi = Math.acos(-1 + (2 * i) / particleCount);
                    const theta = Math.sqrt(particleCount * Math.PI) * phi;
                    tx = r * Math.sin(phi) * Math.cos(theta);
                    ty = r * Math.sin(phi) * Math.sin(theta);
                    tz = r * Math.cos(phi);
                } else {
                    const phi = Math.acos(-1 + (2 * i) / particleCount);
                    const theta = Math.sqrt(particleCount * Math.PI) * phi;
                    const baseWaveX = (baseR + waveAnim) * Math.sin(phi) * Math.cos(theta);
                    const baseWaveY = (baseR + waveAnim) * Math.sin(phi) * Math.sin(theta);
                    const baseWaveZ = (baseR + waveAnim) * Math.cos(phi);

                    tx = baseWaveX + (origX * scatterAmount * pSpeed);
                    ty = baseWaveY + (origY * scatterAmount * pSpeed);
                    tz = baseWaveZ + (origZ * scatterAmount * pSpeed);
                }

                let px = posAttribute.getX(i);
                let py = posAttribute.getY(i);
                let pz = posAttribute.getZ(i);

                px += (tx - px) * 0.08;
                py += (ty - py) * 0.08;
                pz += (tz - pz) * 0.08;

                posAttribute.setXYZ(i, px, py, pz);
            }

            posAttribute.needsUpdate = true;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
