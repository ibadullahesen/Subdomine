<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qızılı Səs Dalğası Küresi - Əl İdarəetməsi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030303;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam {
            display: none;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 0, 0.7);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
            z-index: 10;
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands və Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <video id="webcam" playsinline></video>
    <div id="info">Əlini göstər: Baş & işarə barmaq məsafəsi ilə uzaqlaşdır/yaxınlaşdır | Yumruq edərək topla</div>

    <script>
        let scene, camera, renderer, particles, particleGeometry, particleMaterial;
        const particleCount = 4000;
        let positions, targetPositions, originalPositions;
        
        // Əl izləmə dəyişənləri
        let handPosition = new THREE.Vector3(0, 0, 0);
        let targetHandPosition = new THREE.Vector3(0, 0, 0);
        let isFist = false;
        let targetZDistance = 0; // Baş və işarə barmaq məsafəsi ilə idarə olunan Z oxu / miqyas
        let currentZDistance = 0;

        function init() {
            // Three.js səhnəsinin qurulması
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Zərrəcik sisteminin yaradılması
            particleGeometry = new THREE.BufferGeometry();
            positions = new Float32Array(particleCount * 3);
            targetPositions = new Float32Array(particleCount * 3);
            originalPositions = new Float32Array(particleCount * 3);

            const colors = new Float32Array(particleCount * 3);
            const colorObj = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                // Səs dalğası kimi qabarıq kürə formalı ilkin koordinatlar (Fibonacci sphere + noise)
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;

                // Səs dalğası effekti üçün radiusa dalğavari dəyişkənlik əlavə edirik
                const wave = Math.sin(theta * 8) * Math.cos(phi * 6) * 0.25;
                const radius = 1.2 + wave;

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                originalPositions[i * 3] = x;
                originalPositions[i * 3 + 1] = y;
                originalPositions[i * 3 + 2] = z;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                targetPositions[i * 3] = x;
                targetPositions[i * 3 + 1] = y;
                targetPositions[i * 3 + 2] = z;

                // Qızılı tonlar
                colorObj.setHSL(0.12, 0.9, 0.6 + Math.random() * 0.4);
                colors[i * 3] = colorObj.r;
                colors[i * 3 + 1] = colorObj.g;
                colors[i * 3 + 2] = colorObj.b;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Parıltılı və yumşaq zərrəcik şader materialı
            const canvasTex = createParticleTexture();
            const texture = new THREE.CanvasTexture(canvasTex);

            particleMaterial = new THREE.PointsMaterial({
                size: 0.08,
                map: texture,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
            initMediaPipe();
            animate();
        }

        // Yumşaq işıqlı nöqtə toxuması
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,215,0,0.8)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return canvas;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // MediaPipe Hands Quraşdırılması
        function initMediaPipe() {
            const videoElement = document.getElementById('webcam');
            
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        // Əl hərəkətlərinin təhlili
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Əlin mərkəzi (Bilək və orta barmaq əsası ortası)
                const wrist = landmarks[0];
                const middleMCP = landmarks[9];
                
                // Ekran koordinatlarına çevirmə (-1 ilə 1 arası)
                const x = -((wrist.x + middleMCP.x) / 2 - 0.5) * 5;
                const y = -((wrist.y + middleMCP.y) / 2 - 0.5) * 4;
                targetHandPosition.set(x, y, 0);

                // 1. Baş barmaq (4) və işarə barmaq (8) ucları arasındakı məsafə (Uzaqlaşdırma / Yaxınlaşdırma)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                // Pinch məsafəsini Z dərinliyinə və miqyasa çeviririk
                targetZDistance = (pinchDist - 0.15) * 4.5; // Araladıqda yaxınlaşır, yaxınlaşdırdıqda uzaqlaşır

                // 2. Yumruq yoxlanışı: Barmaq uclarının (8, 12, 16, 20) ovuc evinə (0) yaxınlığı
                let avgDistanceToWrist = 0;
                [8, 12, 16, 20].forEach(tipIdx => {
                    const tip = landmarks[tipIdx];
                    const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                    avgDistanceToWrist += dist;
                });
                avgDistanceToWrist /= 4;

                // Əgər barmaqlar bükülübsə (yumruq)
                isFist = avgDistanceToWrist < 0.28;
            } else {
                targetHandPosition.set(0, 0, 0);
                targetZDistance = 0;
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Əl mövqeyini hamar şəkildə izləmə (Lerp)
            handPosition.lerp(targetHandPosition, 0.1);
            currentZDistance += (targetZDistance - currentZDistance) * 0.1;

            particles.position.copy(handPosition);

            // Küre öz oxu ətrafında yavaşca fırlanır
            particles.rotation.y = elapsedTime * 0.2;
            particles.rotation.x = Math.sin(elapsedTime * 0.1) * 0.1;

            const posAttribute = particleGeometry.attributes.position;
            const colorAttribute = particleGeometry.attributes.color;

            // Yumruq vəziyyətinə görə parıltı və ölçünün tənzimlənməsi
            let targetOpacity = isFist ? 0.2 : 0.85;
            particleMaterial.opacity += (targetOpacity - particleMaterial.opacity) * 0.1;

            let targetSize = isFist ? 0.04 : 0.08;
            particleMaterial.size += (targetSize - particleMaterial.size) * 0.1;

            for (let i = 0; i < particleCount; i++) {
                let ix = originalPositions[i * 3];
                let iy = originalPositions[i * 3 + 1];
                let iz = originalPositions[i * 3 + 2];

                let tx, ty, tz;

                if (isFist) {
                    // Yumruq edəndə hamısı sıx bir nöqtəyə (mərkəzə) yığılır
                    tx = 0;
                    ty = 0;
                    tz = 0;
                } else {
                    // Normal vəziyyət: Səs dalğası kimi dinamik hərəkət edən kürə
                    const pulse = Math.sin(elapsedTime * 3 + i) * 0.08;
                    const scaleFactor = 1.0 + currentZDistance + pulse;
                    
                    tx = ix * scaleFactor;
                    ty = iy * scaleFactor;
                    tz = iz * scaleFactor;
                }

                // Zərrəciklərin mövqeyini hamar şəkildə hədəfə daşıyırıq
                let px = posAttribute.getX(i);
                let py = posAttribute.getY(i);
                let pz = posAttribute.getZ(i);

                px += (tx - px) * 0.08;
                py += (ty - py) * 0.08;
                pz += (tz - pz) * 0.08;

                posAttribute.setXYZ(i, px, py, pz);
            }

            posAttribute.needsUpdate = true;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
