<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qızılı Səs Dalğası - İnteraktiv Əl İdarəetməsi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030303;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam {
            display: none;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 215, 0, 0.8);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            z-index: 10;
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands və Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <video id="webcam" playsinline></video>
    <div id="info">Əlini aç: Dağılsın | Yumruq et: Toplansın | Yumruqda baş & işarə barmaqla ölçünü dəyiş</div>

    <script>
        let scene, camera, renderer, particles, particleGeometry, particleMaterial;
        const particleCount = 10000; // Zərrəcik sayı artırıldı
        let positions, targetPositions, originalPositions, phases;
        
        // Əl izləmə dəyişənləri
        let handPosition = new THREE.Vector3(0, 0, 0);
        let targetHandPosition = new THREE.Vector3(0, 0, 0);
        
        let isFist = false;
        let handSpread = 1.0;       // Əlin açılma dərəcəsi
        let targetHandSpread = 1.0;
        
        let fistScale = 0.3;        // Yumruq zamanı baş/işarə barmaqla idarə olunan ölçü
        let targetFistScale = 0.3;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            particleGeometry = new THREE.BufferGeometry();
            positions = new Float32Array(particleCount * 3);
            targetPositions = new Float32Array(particleCount * 3);
            originalPositions = new Float32Array(particleCount * 3);
            phases = new Float32Array(particleCount);

            const colors = new Float32Array(particleCount * 3);
            const colorObj = new THREE.Color();

            for (let i = 0; i < particleCount; i++) {
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;

                // Səs dalğası kimi qabarıq kürə forması
                const wave = Math.sin(theta * 10) * Math.cos(phi * 8) * 0.2;
                const radius = 1.2 + wave;

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                originalPositions[i * 3] = x;
                originalPositions[i * 3 + 1] = y;
                originalPositions[i * 3 + 2] = z;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                phases[i] = Math.random() * Math.PI * 2;

                // Parlaq qızılı rənglər
                colorObj.setHSL(0.12, 0.9, 0.5 + Math.random() * 0.5);
                colors[i * 3] = colorObj.r;
                colors[i * 3 + 1] = colorObj.g;
                colors[i * 3 + 2] = colorObj.b;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvasTex = createParticleTexture();
            const texture = new THREE.CanvasTexture(canvasTex);

            particleMaterial = new THREE.PointsMaterial({
                size: 0.05,
                map: texture,
                vertexColors: true,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
            initMediaPipe();
            animate();
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,215,0,0.9)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return canvas;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function initMediaPipe() {
            const videoElement = document.getElementById('webcam');
            
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const wrist = landmarks[0];
                const middleMCP = landmarks[9];
                
                const x = -((wrist.x + middleMCP.x) / 2 - 0.5) * 5;
                const y = -((wrist.y + middleMCP.y) / 2 - 0.5) * 4;
                targetHandPosition.set(x, y, 0);

                // 1. Əlin açılma dərəcəsi: Bilək (0) ilə barmaq ucları (8, 12, 16, 20) arasındakı orta məsafə
                let totalSpread = 0;
                [8, 12, 16, 20].forEach(tipIdx => {
                    const tip = landmarks[tipIdx];
                    const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                    totalSpread += dist;
                });
                totalSpread /= 4;
                // Əl nə qədər çox açılarsa, targetHandSpread bir o qədər böyüyür (məs: 0.8 ilə 2.5 arası)
                targetHandSpread = 0.6 + (totalSpread * 3.5);

                // 2. Yumruq yoxlanışı
                let avgDistanceToWrist = 0;
                [8, 12, 16, 20].forEach(tipIdx => {
                    const tip = landmarks[tipIdx];
                    const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
                    avgDistanceToWrist += dist;
                });
                avgDistanceToWrist /= 4;
                isFist = avgDistanceToWrist < 0.28;

                // 3. Əgər yumruqdadırsa, baş barmaq (4) və işarə barmaq (8) məsafəsi ilə kiçik kürənin ölçüsünü tənzimlə
                if (isFist) {
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                    targetFistScale = 0.1 + (pinchDist * 1.5); // Barmaqları açdıqca yumruq içindəki kürə böyüyür
                }
            } else {
                targetHandPosition.set(0, 0, 0);
                targetHandSpread = 1.0;
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            handPosition.lerp(targetHandPosition, 0.1);
            handSpread += (targetHandSpread - handSpread) * 0.1;
            fistScale += (targetFistScale - fistScale) * 0.1;

            particles.position.copy(handPosition);
            particles.rotation.y = elapsedTime * 0.15;
            particles.rotation.x = Math.sin(elapsedTime * 0.08) * 0.1;

            const posAttribute = particleGeometry.attributes.position;

            // Yumruq zamanı zərrəciklər tam itmir, kiçik parlaq nöqtəyə yığılır
            let targetOpacity = isFist ? 0.9 : 0.85;
            particleMaterial.opacity += (targetOpacity - particleMaterial.opacity) * 0.1;

            let targetSize = isFist ? 0.03 : 0.05;
            particleMaterial.size += (targetSize - particleMaterial.size) * 0.1;

            for (let i = 0; i < particleCount; i++) {
                let ix = originalPositions[i * 3];
                let iy = originalPositions[i * 3 + 1];
                let iz = originalPositions[i * 3 + 2];
                let pPhase = phases[i];

                let tx, ty, tz;

                // Daimi səs dalğası animasiyası (həmişə işləyir)
                const waveAnim = Math.sin(elapsedTime * 4 + pPhase) * 0.08;

                if (isFist) {
                    // Yumruq: Mərkəzə yığılır, amma baş/işarə barmaqla ölçüsü idarə olunur + yüngül dalğalanır
                    const compactWave = Math.sin(elapsedTime * 6 + pPhase) * 0.02;
                    tx = ix * (fistScale + compactWave);
                    ty = iy * (fistScale + compactWave);
                    tz = iz * (fistScale + compactWave);
                } else {
                    // Açıq əl: Əli nə qədər çox açırsınızsa (handSpread), toz bir o qədər çox dağılır
                    const scaleFactor = handSpread + waveAnim;
                    tx = ix * scaleFactor;
                    ty = iy * scaleFactor;
                    tz = iz * scaleFactor;
                }

                let px = posAttribute.getX(i);
                let py = posAttribute.getY(i);
                let pz = posAttribute.getZ(i);

                px += (tx - px) * 0.1;
                py += (ty - py) * 0.1;
                pz += (tz - pz) * 0.1;

                posAttribute.setXYZ(i, px, py, pz);
            }

            posAttribute.needsUpdate = true;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
