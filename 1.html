<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisibility Cloak - Effect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body class="bg-black m-0 overflow-hidden w-screen h-screen flex items-center justify-center">

    <video id="input_video" class="hidden" autoplay playsinline></video>
    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
    <canvas id="bg_canvas" class="hidden"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const outputCanvas = document.getElementById('output_canvas');
        const canvasCtx = outputCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bg_canvas');
        const bgCtx = bgCanvas.getContext('2d');

        let backgroundCaptured = false;
        let isInvisible = false;
        let wasTouching = false;
        let bgImage = null;
        let effectProgress = 0.0; // Şəffaflıq/keçid səviyyəsi (0-dan 1-ə)

        function setupCanvas(video) {
            outputCanvas.width = video.videoWidth;
            outputCanvas.height = video.videoHeight;
            bgCanvas.width = video.videoWidth;
            bgCanvas.height = video.videoHeight;
        }

        function captureBackground() {
            if (!backgroundCaptured && videoElement.videoWidth > 0) {
                setupCanvas(videoElement);
                bgCtx.drawImage(videoElement, 0, 0, bgCanvas.width, bgCanvas.height);
                bgImage = bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height);
                backgroundCaptured = true;
            }
        }

        function onResults(results) {
            if (!backgroundCaptured) {
                captureBackground();
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            if (!backgroundCaptured || !bgImage) {
                canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
                canvasCtx.restore();
                return;
            }

            let isTouchingNow = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const x1 = landmarks[4].x * outputCanvas.width;
                const y1 = landmarks[4].y * outputCanvas.height;
                const x2 = landmarks[8].x * outputCanvas.width;
                const y2 = landmarks[8].y * outputCanvas.height;

                if (Math.hypot(x2 - x1, y2 - y1) < 40) {
                    isTouchingNow = true;
                }
            }

            // Toggle məntiqi
            if (wasTouching && !isTouchingNow) {
                isInvisible = !isInvisible;
            }
            wasTouching = isTouchingNow;

            // Keçid effektinin yumşaq artması və ya azalması (Animate transition)
            if (isInvisible) {
                if (effectProgress < 1.0) effectProgress += 0.08; // Yavaş-yavaş yox olur
            } else {
                if (effectProgress > 0.0) effectProgress -= 0.08; // Yavaş-yavaş geri qayıdır
            }

            // 1. Əvvəlcə canlı kameranı çəkirik
            canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

            // 2. Əgər keçid başlayıbsa, arxa fonu üzərinə müəyyən şəffaflıqla (alpha) qatırıq ki, şəffaf/kibertapanca effekti yaransın
            if (effectProgress > 0) {
                // Arxa fonu çəkirik
                canvasCtx.save();
                canvasCtx.globalAlpha = effectProgress; // Şəffaflıq dərəcəsi
                canvasCtx.putImageData(bgImage, 0, 0);
                
                // Yoxolma anında xüsusi vizual "hologram / parıltı" effekti əlavə etmək üçün rəng filtri
                canvasCtx.fillStyle = `rgba(0, 255, 255, ${effectProgress * 0.15})`; 
                canvasCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
                canvasCtx.restore();
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>
</html>
