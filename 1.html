<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görünməzlik Effekti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Canvas ölçüləri
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // State
        let videoElement = null;
        let handDetector = null;
        let backgroundCanvas = null;
        let isInvisible = false;
        let isPinching = false;
        let wasPinching = false;
        let backgroundCaptured = false;
        let captureStartTime = null;
        let animationFrameId = null;
        
        // MediaPipe Hands inisializasiyası
        async function initializeMediaPipe() {
            try {
                const vision = window;
                
                handDetector = await vision.FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                ).then(fileset => {
                    return new vision.GestureRecognizer({
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-studio/latest/gesture_recognizer.task"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    });
                }).catch(() => {
                    // GestureRecognizer mövcud deyilsə HandLandmarker istifadə edin
                    return new vision.HandLandmarker({
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-studio/latest/hand_landmarker.task"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    });
                });
                
                console.log("MediaPipe yükləndi");
                setupCamera();
            } catch (error) {
                console.error("MediaPipe yükləmə xətası:", error);
                // Fallback
                setupCamera();
            }
        }
        
        // Kamera quraşdırması
        async function setupCamera() {
            try {
                videoElement = document.createElement('video');
                videoElement.autoplay = true;
                videoElement.playsInline = true;
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: canvas.width },
                        height: { ideal: canvas.height }
                    }
                });
                
                videoElement.srcObject = stream;
                videoElement.addEventListener('loadedmetadata', () => {
                    console.log("Kamera hazır");
                    captureStartTime = Date.now();
                    animate();
                });
            } catch (error) {
                console.error("Kamera xətası:", error);
            }
        }
        
        // Piçləmə (pinch) aşkar etmə
        function detectPinch(landmarks) {
            if (!landmarks || landmarks.length === 0) return false;
            
            const hand = landmarks[0];
            if (!hand.landmarks) return false;
            
            // Baş barmaq (4) və işarə barmağı (8) ucları
            const thumb = hand.landmarks[4];
            const index = hand.landmarks[8];
            
            if (!thumb || !index) return false;
            
            // Aralarındakı məsafə
            const dx = thumb.x - index.x;
            const dy = thumb.y - index.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 0.05 məsafəsi piçləmə hesab olunur
            return distance < 0.05;
        }
        
        // Arxa fon yadda saxlama
        function captureBackground() {
            if (!backgroundCaptured) {
                backgroundCanvas = document.createElement('canvas');
                backgroundCanvas.width = canvas.width;
                backgroundCanvas.height = canvas.height;
                const bgCtx = backgroundCanvas.getContext('2d');
                bgCtx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                backgroundCaptured = true;
                console.log("Arxa fon yadda saxlandı");
            }
        }
        
        // Görünməzlik effekti - person silüetini çıxarma
        function applyInvisibilityEffect(videoFrame, background) {
            if (!background) return;
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const bgData = getBackgroundImageData(background);
            
            // Sadə renk analizi ilə insanı aşkar et
            // Dəri tonu rəng aralığında olan piksellər görünməz ol
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Dəri tonunun təxmini rəng aralığı
                if (r > 95 && g > 40 && b > 20 &&
                    r > b && r > g && 
                    Math.abs(r - g) > 15) {
                    
                    // Bu piksel dəri tonu ola bilər - arxa fondan göstər
                    if (bgData) {
                        data[i] = bgData[i];
                        data[i + 1] = bgData[i + 1];
                        data[i + 2] = bgData[i + 2];
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        // Arxa fon məlumatını al
        function getBackgroundImageData(bgCanvas) {
            const bgCtx = bgCanvas.getContext('2d');
            return bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height).data;
        }
        
        // Əsas animasiya döngüsü
        async function animate() {
            animationFrameId = requestAnimationFrame(animate);
            
            if (!videoElement || !videoElement.readyState === 4) return;
            
            // Arxa fon yadda saxlama (ilk 1-2 saniyə)
            if (!backgroundCaptured && captureStartTime) {
                const elapsed = Date.now() - captureStartTime;
                if (elapsed < 2000) {
                    captureBackground();
                }
            }
            
            // Video çərçəvəsini kanvasa çək
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            // Hand Detection (MediaPipe mövcudsa)
            if (handDetector) {
                try {
                    const results = handDetector.detectForVideo(videoElement, Date.now());
                    
                    if (results.landmarks) {
                        wasPinching = isPinching;
                        isPinching = detectPinch(results.landmarks);
                        
                        // Piçləmə basıldığında toggle et
                        if (isPinching && !wasPinching) {
                            isInvisible = !isInvisible;
                            console.log(isInvisible ? "Görünməz" : "Görünən");
                        }
                    }
                } catch (error) {
                    console.error("Detection xətası:", error);
                }
            }
            
            // Görünməzlik effekti tətbiq et
            if (isInvisible && backgroundCaptured && backgroundCanvas) {
                applyInvisibilityEffect(videoElement, backgroundCanvas);
            }
        }
        
        // Pencərə ölçüsü dəyişdiyində kanvası yenidən hazırla
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (backgroundCanvas) {
                const bgCtx = backgroundCanvas.getContext('2d');
                bgCtx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            }
        });
        
        // Səhifə açılan kimi başlat
        window.addEventListener('load', () => {
            initializeMediaPipe();
        });
        
        // Səhifə bağlananda kamerayı söndür
        window.addEventListener('beforeunload', () => {
            if (videoElement && videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });
    </script>
</body>
</html>
