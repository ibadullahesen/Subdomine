<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Cloak Effect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body class="bg-black m-0 overflow-hidden w-screen h-screen flex items-center justify-center">

    <video id="input_video" class="hidden" autoplay playsinline></video>
    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
    <canvas id="bg_canvas" class="hidden"></canvas>
    <canvas id="buffer_canvas" class="hidden"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const outputCanvas = document.getElementById('output_canvas');
        const canvasCtx = outputCanvas.getContext('2d', { willReadFrequently: true });
        const bgCanvas = document.getElementById('bg_canvas');
        const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });
        const bufferCanvas = document.getElementById('buffer_canvas');
        const bufferCtx = bufferCanvas.getContext('2d', { willReadFrequently: true });

        let backgroundCaptured = false;
        let isGlassActive = false;
        let wasTouching = false;
        let bgImageData = null;
        
        let latestHandsResults = null;
        let latestSegmentationResults = null;

        function setupCanvas(video) {
            if (outputCanvas.width !== video.videoWidth || outputCanvas.height !== video.videoHeight) {
                outputCanvas.width = video.videoWidth;
                outputCanvas.height = video.videoHeight;
                bgCanvas.width = video.videoWidth;
                bgCanvas.height = video.videoHeight;
                bufferCanvas.width = video.videoWidth;
                bufferCanvas.height = video.videoHeight;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(results => { latestHandsResults = results; });

        const selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(results => {
            latestSegmentationResults = results;
            drawFrame();
        });

        function drawFrame() {
            if (videoElement.paused || videoElement.ended) return;

            setupCanvas(videoElement);

            if (!backgroundCaptured && videoElement.videoWidth > 0) {
                bgCtx.drawImage(videoElement, 0, 0, bgCanvas.width, bgCanvas.height);
                bgImageData = bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height);
                backgroundCaptured = true;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            // 1. Canlı kameranı əsas ekrana çəkirik
            canvasCtx.drawImage(videoElement, 0, 0, outputCanvas.width, outputCanvas.height);

            // Barmaq toxunmasını yoxlayırıq (Toggle)
            let isTouchingNow = false;
            if (latestHandsResults && latestHandsResults.multiHandLandmarks && latestHandsResults.multiHandLandmarks.length > 0) {
                const lm = latestHandsResults.multiHandLandmarks[0];
                const x1 = lm[4].x * outputCanvas.width;
                const y1 = lm[4].y * outputCanvas.height;
                const x2 = lm[8].x * outputCanvas.width;
                const y2 = lm[8].y * outputCanvas.height;

                if (Math.hypot(x2 - x1, y2 - y1) < 40) {
                    isTouchingNow = true;
                }
            }

            if (wasTouching && !isTouchingNow) {
                isGlassActive = !isGlassActive;
            }
            wasTouching = isTouchingNow;

            // 2. Şüşə Effekti aktivdirsə, piksel səviyyəsində arxa fonu bədən siluetinin üzərinə işləyirik
            if (isGlassActive && backgroundCaptured && bgImageData && latestSegmentationResults) {
                // Buffer canvas-a arxa fonu qoyuruq
                bufferCtx.putImageData(bgImageData, 0, 0);

                // MediaPipe maskasını buffer üzərinə çəkirik ki, insanın yerini kəsək
                bufferCtx.save();
                bufferCtx.globalCompositeOperation = 'destination-in';
                bufferCtx.drawImage(latestSegmentationResults.segmentationMask, 0, 0, bufferCanvas.width, bufferCanvas.height);
                bufferCtx.restore();

                // İndi həmin kəsilmiş şüşə siluetini əsas canlı kameranın üzərinə əlavə edirik
                canvasCtx.save();
                // Şüşə şəffaflığı (arxanı göstərən hissə)
                canvasCtx.globalAlpha = 0.85; 
                canvasCtx.drawImage(bufferCanvas, 0, 0);

                // Şüşə kənarlarına parıltı və rəng sınması (Refraction tint) veririk
                canvasCtx.globalCompositeOperation = 'source-atop';
                canvasCtx.fillStyle = "rgba(150, 210, 255, 0.2)";
                canvasCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
                canvasCtx.restore();
            }

            canvasCtx.restore();
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
                await selfieSegmentation.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            console.error("Kamera xətası:", err);
        });
    </script>
</body>
</html>
