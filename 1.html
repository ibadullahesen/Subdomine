<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Glass Cloak - 3D Shader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Glass Refraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body class="bg-black m-0 overflow-hidden w-screen h-screen">

    <video id="input_video" class="hidden" autoplay playsinline></video>

    <script>
        let videoElement = document.getElementById('input_video');
        let scene, camera, renderer, videoTexture, glassMesh;
        let isGlassActive = false;
        let wasTouching = false;
        let latestHandsResults = null;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Kameranı Three.js üçün teksturə çeviririk
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;

            // Arxa fon (ekranı dolduran video səhnəsi)
            let bgGeometry = new THREE.PlaneGeometry(16, 9);
            let bgMaterial = new THREE.MeshBasicMaterial({ map: videoTexture });
            let bgMesh = new THREE.Mesh(bgGeometry, bgMaterial);
            bgMesh.scale.set(1.1, 1.1, 1.1);
            scene.add(bgMesh);

            // Əsl Fiziki Şüşə Materialı (Transmission & Refraction - Videodakı kimi)
            let glassGeometry = new THREE.SphereGeometry(1.5, 32, 32);
            let glassMaterial = new THREE.MeshPhysicalMaterial({
                transmission: 0.95, // Tam şəffaflıq / şüşə effekti
                opacity: 1,
                transparent: true,
                roughness: 0.05,    // Mükəmməl hamar şüşə
                ior: 1.5,           // İşıq sınma əmsalı (Index of Refraction - şüşənin əsas fiziki özəlliyi)
                thickness: 1.2,     // Şüşənin qalınlığı
                specularIntensity: 1.0
            });

            glassMesh = new THREE.Mesh(glassGeometry, glassMaterial);
            glassMesh.visible = false; // Başlanğıcda gizlidir
            scene.add(glassMesh);
        }

        // MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(results => { latestHandsResults = results; });

        function animate() {
            requestAnimationFrame(animate);

            // Barmaq toxunmasını yoxlayırıq (Toggle)
            if (latestHandsResults && latestHandsResults.multiHandLandmarks && latestHandsResults.multiHandLandmarks.length > 0) {
                const lm = latestHandsResults.multiHandLandmarks[0];
                const x1 = lm[4].x;
                const y1 = lm[4].y;
                const x2 = lm[8].x;
                const y2 = lm[8].y;

                let distance = Math.hypot(x2 - x1, y2 - y1);
                let isTouchingNow = distance < 0.05;

                if (wasTouching && !isTouchingNow) {
                    isGlassActive = !isGlassActive;
                    glassMesh.visible = isGlassActive;
                }
                wasTouching = isTouchingNow;

                // Əgər şüşə aktivdirsə, əlimizin və ya barmağımızın koordinatına uyğun hərəkət etsin
                if (isGlassActive) {
                    glassMesh.position.x = (lm[9].x - 0.5) * -5;
                    glassMesh.position.y = -(lm[9].y - 0.5) * 3;
                }
            }

            renderer.render(scene, camera);
        }

        const cam = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        cam.start().then(() => {
            init3D();
            animate();
        });
    </script>
</body>
</html>
