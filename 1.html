<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görünməzlik Effekti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #0f0;
            font-family: monospace;
            max-width: 320px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="debug">
        <div style="color: #ff0">📍 Yüklənir...</div>
        <div id="status"></div>
        <div id="hand"></div>
        <div id="pinch"></div>
        <div id="invisible"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const statusEl = document.getElementById('status');
        const handEl = document.getElementById('hand');
        const pinchEl = document.getElementById('pinch');
        const invisibleEl = document.getElementById('invisible');
        
        // Canvas ölçüləri
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // State
        let videoElement = null;
        let backgroundImageData = null;
        let isInvisible = false;
        let isPinching = false;
        let wasPinching = false;
        let backgroundCaptured = false;
        let captureStartTime = null;
        let animationFrameId = null;
        let lastPinchTime = 0;
        
        function updateStatus(msg) {
            statusEl.textContent = msg;
        }
        
        // Kamera quraşdırması
        async function setupCamera() {
            try {
                updateStatus('📷 Kamera açılır...');
                
                videoElement = document.createElement('video');
                videoElement.autoplay = true;
                videoElement.playsInline = true;
                videoElement.muted = true;
                videoElement.setAttribute('playsinline', '');
                
                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                return new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        updateStatus('📷 Kamera ✓');
                        captureStartTime = Date.now();
                        resolve();
                    };
                });
            } catch (error) {
                console.error("Kamera xətası:", error);
                updateStatus('❌ Kamera: ' + error.message);
                throw error;
            }
        }
        
        // Sadə əl aşkarlaması - rengi analiz etməklə
        function detectHandsSimple() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let skinCount = 0;
            
            // Dəri tonunu aşkar et
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Dəri tonu aşkarlaması
                const isSkin = r > 80 && g > 50 && b > 30 &&
                              r > b && r > g &&
                              Math.abs(r - g) > 10;
                
                if (isSkin) {
                    skinCount++;
                }
            }
            
            return skinCount > 500;
        }
        
        // Piçləmə aşkar etmə - əl hərəkətinin analizi
        function detectPinchGesture() {
            if (!videoElement) return false;
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let skinPixelCount = 0;
            
            // Dəri tonunu say
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Dəri tonu
                const isSkin = r > 80 && g > 50 && b > 30 &&
                              r > b && r > g &&
                              Math.abs(r - g) > 10;
                
                if (isSkin) {
                    skinPixelCount++;
                }
            }
            
            // Dəri pikselləri toplanmışdısa = piçləmə (əl toplanıb)
            return skinPixelCount > 1500 && skinPixelCount < 6000;
        }
        
        // Arxa fon yadda saxlama
        function captureBackground() {
            if (!backgroundCaptured && videoElement) {
                try {
                    backgroundImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    backgroundCaptured = true;
                    console.log("✓ Arxa fon yadda saxlandı");
                } catch (e) {
                    console.error("Arxa fon xətası:", e);
                }
            }
        }
        
        // Görünməzlik effekti
        function applyInvisibilityEffect() {
            if (!backgroundCaptured || !backgroundImageData) return;
            
            try {
                const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const current = currentImageData.data;
                const background = backgroundImageData.data;
                
                for (let i = 0; i < current.length; i += 4) {
                    const r = current[i];
                    const g = current[i + 1];
                    const b = current[i + 2];
                    
                    const isSkin = r > 80 && g > 50 && b > 30 &&
                                  r > b && r > g &&
                                  Math.abs(r - g) > 10;
                    
                    if (isSkin) {
                        current[i] = background[i];
                        current[i + 1] = background[i + 1];
                        current[i + 2] = background[i + 2];
                    }
                }
                
                ctx.putImageData(currentImageData, 0, 0);
            } catch (e) {
                console.error("Effekt xətası:", e);
            }
        }
        
        // Əsas animasiya döngüsü
        async function animate() {
            animationFrameId = requestAnimationFrame(animate);
            
            if (!videoElement || videoElement.readyState !== 4) return;
            
            // Video çərçəvəsini kanvasa çək (əks)
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -canvas.width, 0, canvas.width, canvas.height);
            ctx.scale(-1, 1);
            
            // Arxa fon yadda saxlama (ilk 2 saniyə)
            if (!backgroundCaptured && captureStartTime) {
                const elapsed = Date.now() - captureStartTime;
                if (elapsed > 500 && elapsed < 2500) {
                    captureBackground();
                }
            }
            
            // Əl aşkar etmə
            const handDetected = detectHandsSimple();
            handEl.textContent = handDetected ? '✋ El: AYAQDA' : '✋ El: YOX';
            handEl.style.color = handDetected ? '#0f0' : '#666';
            
            // Piçləmə aşkar etmə
            wasPinching = isPinching;
            isPinching = detectPinchGesture();
            
            pinchEl.textContent = isPinching ? '✊ PİÇLƏMƏ: AKTIV' : '✊ Piçləmə: gözlə';
            pinchEl.style.color = isPinching ? '#f0f' : '#666';
            
            // Toggle
            const now = Date.now();
            if (isPinching && !wasPinching && (now - lastPinchTime) > 400) {
                isInvisible = !isInvisible;
                lastPinchTime = now;
                console.log("TOGGLE: " + (isInvisible ? "GÖRÜNMƏZ ✓" : "GÖRÜNƏN ✓"));
            }
            
            // Görünməzlik effekti
            if (isInvisible && backgroundCaptured) {
                applyInvisibilityEffect();
            }
            
            // Status
            invisibleEl.textContent = isInvisible ? '👻 GÖRÜNMƏZ ✓' : '👁️ GÖRÜNƏN';
            invisibleEl.style.color = isInvisible ? '#0f0' : '#f00';
            invisibleEl.style.fontWeight = 'bold';
        }
        
        // Başlat
        async function start() {
            try {
                await setupCamera();
                updateStatus('🎬 Başlıyır...');
                setTimeout(() => {
                    animate();
                }, 100);
            } catch (error) {
                console.error("Xəta:", error);
            }
        }
        
        // Pencərə ölçüsü dəyişdiyində
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Səhifə bağlananda
        window.addEventListener('beforeunload', () => {
            if (videoElement && videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });
        
        // Başlat
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    </script>
</body>
</html>
