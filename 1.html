<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisibility Cloak</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body class="bg-black m-0 overflow-hidden w-screen h-screen flex items-center justify-center">

    <!-- Video Element (Hidden, used for processing) -->
    <video id="input_video" class="hidden" autoplay playsinline></video>

    <!-- Canvas for rendering the invisibility effect -->
    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>

    <!-- Hidden canvas to capture background snapshot -->
    <canvas id="bg_canvas" class="hidden"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const outputCanvas = document.getElementById('output_canvas');
        const canvasCtx = outputCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bg_canvas');
        const bgCtx = bgCanvas.getContext('2d');

        let backgroundCaptured = false;
        let isInvisible = false;
        let wasTouching = false;
        let bgImage = null;

        // Canvas ölçülərini tənzimləyirik
        function setupCanvas(video) {
            outputCanvas.width = video.videoWidth;
            outputCanvas.height = video.videoHeight;
            bgCanvas.width = video.videoWidth;
            bgCanvas.height = video.videoHeight;
        }

        // Arxa fonu ilk 2 saniyədə avtomatik çəkirik
        function captureBackground() {
            if (!backgroundCaptured && videoElement.videoWidth > 0) {
                setupCanvas(videoElement);
                bgCtx.drawImage(videoElement, 0, 0, bgCanvas.width, bgCanvas.height);
                bgImage = bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height);
                backgroundCaptured = true;
                console.log("Arxa fon yadda saxlanıldı!");
            }
        }

        function onResults(results) {
            if (!backgroundCaptured) {
                captureBackground();
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            // Əgər arxa fon hələ çəkilməyibsə, sadəcə kameranı göstər
            if (!backgroundCaptured || !bgImage) {
                canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
                canvasCtx.restore();
                return;
            }

            let isTouchingNow = false;

            // Əl koordinatlarını yoxlayırıq
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const thumbTip = landmarks[4];  // Baş barmaq ucu
                const indexTip = landmarks[8];  // İşarə barmaq ucu

                // Piksel koordinatlarına çeviririk
                const x1 = thumbTip.x * outputCanvas.width;
                const y1 = thumbTip.y * outputCanvas.height;
                const x2 = indexTip.x * outputCanvas.width;
                const y2 = indexTip.y * outputCanvas.height;

                // İki barmaq arasındakı məsafə
                const distance = Math.hypot(x2 - x1, y2 - y1);

                // Əgər məsafə kifayət qədər kiçikdirsə (toxunursa)
                if (distance < 40) {
                    isTouchingNow = true;
                }
            }

            // Toggle məntiqi: Barmaqlar toxunub ayrıldığı an vəziyyət dəyişir
            if (wasTouching && !isTouchingNow) {
                isInvisible = !isInvisible;
            }
            wasTouching = isTouchingNow;

            if (isInvisible) {
                // Görünməz rejimdəyiksə, kadra arxa fonu qoyuruq
                canvasCtx.putImageData(bgImage, 0, 0);
            } else {
                // Normal rejimdə canlı kameranı göstəririk
                canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
            }

            canvasCtx.restore();
        }

        // MediaPipe Hands quraşdırılması
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // Kameranı işə salırıq
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>
</html>
