<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görünməzlik Effekti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            max-width: 300px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="debug">
        <div>Yüklənir...</div>
        <div id="status"></div>
        <div id="pinch"></div>
        <div id="invisible"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusEl = document.getElementById('status');
        const pinchEl = document.getElementById('pinch');
        const invisibleEl = document.getElementById('invisible');
        
        // Canvas ölçüləri
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // State
        let videoElement = null;
        let handLandmarker = null;
        let backgroundImageData = null;
        let isInvisible = false;
        let isPinching = false;
        let wasPinching = false;
        let backgroundCaptured = false;
        let captureStartTime = null;
        let animationFrameId = null;
        let lastPinchTime = 0;
        let mediaPipeReady = false;
        
        function updateStatus(msg) {
            statusEl.textContent = msg;
        }
        
        // MediaPipe Hands inisializasiyası
        async function initializeMediaPipe() {
            try {
                updateStatus('MediaPipe yüklənir...');
                
                // MediaPipe global object-ə başla
                if (!window.FilesetResolver) {
                    updateStatus('MediaPipe bağlantısı yoxdur');
                    mediaPipeReady = false;
                    setupCamera();
                    return;
                }
                
                const vision = await window.FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
                );
                
                handLandmarker = await window.HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-studio/latest/hand_landmarker.task"
                    },
                    runningMode: "VIDEO",
                    numHands: 2
                });
                
                mediaPipeReady = true;
                updateStatus('MediaPipe ✓ Yükləndi');
                console.log("MediaPipe HandLandmarker yükləndi");
                setupCamera();
            } catch (error) {
                console.error("MediaPipe yükləmə xətası:", error);
                mediaPipeReady = false;
                updateStatus('MediaPipe xətası - əl aşkarlaması OFF');
                setupCamera();
            }
        }
        
        // MediaPipe yükləninə qədər gözlə
        function waitForMediaPipe() {
            if (typeof window.FilesetResolver !== 'undefined') {
                initializeMediaPipe();
            } else {
                setTimeout(waitForMediaPipe, 100);
            }
        }
        
        // Kamera quraşdırması
        async function setupCamera() {
            try {
                updateStatus('Kamera açılır...');
                
                videoElement = document.createElement('video');
                videoElement.autoplay = true;
                videoElement.playsInline = true;
                videoElement.muted = true;
                
                const constraints = {
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                videoElement.addEventListener('loadedmetadata', () => {
                    updateStatus('Kamera ✓ Aktiv');
                    captureStartTime = Date.now();
                    animate();
                });
                
                videoElement.addEventListener('error', (e) => {
                    console.error("Video xətası:", e);
                    updateStatus('Video xətası');
                });
            } catch (error) {
                console.error("Kamera xətası:", error);
                updateStatus('Kamera açıla bilmədi: ' + error.message);
            }
        }
        
        // Piçləmə (pinch) aşkar etmə - iki barmaq arası məsafə
        function detectPinch(handedness, landmarks) {
            if (!landmarks || landmarks.length < 9) return false;
            
            // Baş barmaq (4) və işarə barmağı (8) ucları
            const thumb = landmarks[4];
            const index = landmarks[8];
            
            if (!thumb || !index) return false;
            
            // Aralarındakı məsafə (0-1 arası)
            const dx = thumb.x - index.x;
            const dy = thumb.y - index.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 0.08 məsafəsi piçləmə hesab olunur
            return distance < 0.08;
        }
        
        // Arxa fon yadda saxlama
        function captureBackground() {
            if (!backgroundCaptured && videoElement) {
                try {
                    backgroundImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    backgroundCaptured = true;
                    console.log("Arxa fon yadda saxlandı");
                } catch (e) {
                    console.error("Arxa fon capture xətası:", e);
                }
            }
        }
        
        // Görünməzlik effekti tətbiq etmə
        function applyInvisibilityEffect() {
            if (!backgroundCaptured || !backgroundImageData) return;
            
            try {
                const currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const current = currentImageData.data;
                const background = backgroundImageData.data;
                
                // Hər piksel üçün dəri tonu aşkar etmə
                for (let i = 0; i < current.length; i += 4) {
                    const r = current[i];
                    const g = current[i + 1];
                    const b = current[i + 2];
                    const a = current[i + 3];
                    
                    // Dəri tonu aşkar etmə (daha geniş aralıq)
                    const isSkin = r > 80 && g > 50 && b > 30 &&
                                  r > b && r > g &&
                                  Math.abs(r - g) > 10 &&
                                  (Math.max(r, g, b) - Math.min(r, g, b)) > 20;
                    
                    if (isSkin) {
                        // Arxa fondan yerləşdir
                        current[i] = background[i];
                        current[i + 1] = background[i + 1];
                        current[i + 2] = background[i + 2];
                        current[i + 3] = background[i + 3];
                    }
                }
                
                ctx.putImageData(currentImageData, 0, 0);
            } catch (e) {
                console.error("Görünməzlik effekti xətası:", e);
            }
        }
        
        // Əsas animasiya döngüsü
        async function animate() {
            animationFrameId = requestAnimationFrame(animate);
            
            if (!videoElement || videoElement.readyState !== 4) return;
            
            // Video çərçəvəsini kanvasa çək (əks)
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -canvas.width, 0, canvas.width, canvas.height);
            ctx.scale(-1, 1);
            
            // Arxa fon yadda saxlama (ilk 2 saniyə)
            if (!backgroundCaptured && captureStartTime) {
                const elapsed = Date.now() - captureStartTime;
                if (elapsed > 500 && elapsed < 2500) {
                    captureBackground();
                }
            }
            
            // Hand Detection
            if (mediaPipeReady && handLandmarker && videoElement) {
                try {
                    const result = handLandmarker.detectForVideo(videoElement, performance.now());
                    
                    if (result.landmarks && result.landmarks.length > 0) {
                        wasPinching = isPinching;
                        
                        // Əl aşkar edildi - piçləməni kontrol et
                        isPinching = false;
                        for (let i = 0; i < result.landmarks.length; i++) {
                            if (detectPinch(result.handedness[i]?.displayName, result.landmarks[i])) {
                                isPinching = true;
                                break;
                            }
                        }
                        
                        // Piçləmə başlıqdan sonra toggle
                        const now = Date.now();
                        if (isPinching && !wasPinching && (now - lastPinchTime) > 300) {
                            isInvisible = !isInvisible;
                            lastPinchTime = now;
                            console.log("Toggle: " + (isInvisible ? "GÖRÜNMƏZ" : "GÖRÜNƏN"));
                        }
                        
                        pinchEl.textContent = '✋ El: AYAQDA';
                        pinchEl.style.color = isPinching ? '#0f0' : '#f0f';
                    } else {
                        pinchEl.textContent = '✋ El: YOX';
                        pinchEl.style.color = '#666';
                        isPinching = false;
                    }
                } catch (error) {
                    console.error("Detection xətası:", error);
                }
            }
            
            // Görünməzlik effekti tətbiq et
            if (isInvisible && backgroundCaptured) {
                applyInvisibilityEffect();
            }
            
            // Status güncəllə
            invisibleEl.textContent = '👻 ' + (isInvisible ? 'GÖRÜNMƏZ' : 'GÖRÜNƏN');
            invisibleEl.style.color = isInvisible ? '#0f0' : '#f00';
        }
        
        // Pencərə ölçüsü dəyişdiyində
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Səhifə yüklənən kimi başlat
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', waitForMediaPipe);
        } else {
            waitForMediaPipe();
        }
        
        // Səhifə bağlananda
        window.addEventListener('beforeunload', () => {
            if (videoElement && videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });
    </script>
</body>
</html>
