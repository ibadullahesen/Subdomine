<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisibility Cloak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body class="bg-black m-0 overflow-hidden w-screen h-screen flex items-center justify-center">

    <video id="input_video" class="hidden" autoplay playsinline></video>
    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
    <canvas id="bg_canvas" class="hidden"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const outputCanvas = document.getElementById('output_canvas');
        const canvasCtx = outputCanvas.getContext('2d');
        const bgCanvas = document.getElementById('bg_canvas');
        const bgCtx = bgCanvas.getContext('2d');

        let backgroundCaptured = false;
        let isGlassActive = false;
        let wasTouching = false;
        let bgImage = null;
        
        let latestHandsResults = null;
        let latestSegmentationResults = null;

        // --- ƏLAVƏ: su dalğası effekti üçün ---
        const ripples = []; // { x, y, start, seed }
        const RIPPLE_SPEED = 340; // px/san
        const MAX_RIPPLES = 6;

        function edgeNoise(angle, t, seed, dampen) {
            const n = Math.sin(angle * 6 + t * 1.6 + seed) * 0.5
                    + Math.sin(angle * 13 - t * 2.3 + seed * 2.1) * 0.3
                    + Math.sin(angle * 27 + t * 3.4 + seed * 3.7) * 0.2;
            return n * dampen;
        }

        function buildRipplePath(ctx, cx, cy, radius, t, seed, amplitude) {
            const segments = 72;
            ctx.beginPath();
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const n = edgeNoise(angle, t, seed, amplitude);
                const r = Math.max(0, radius + n);
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function drawRipples(now) {
            const maxR = Math.hypot(outputCanvas.width, outputCanvas.height) * 0.75;
            while (ripples.length > MAX_RIPPLES) ripples.shift();

            for (const rp of ripples) {
                const t = (now - rp.start) / 1000;
                const radius = Math.min(t * RIPPLE_SPEED, maxR);
                const fade = Math.max(0, 1 - radius / maxR);
                if (fade <= 0) continue;

                // Daşın suya düşdüyü an — parlaq sıçrayış
                if (t < 0.25) {
                    const flashR = (t / 0.25) * 55;
                    const flashAlpha = (1 - t / 0.25) * 0.9;
                    const g = canvasCtx.createRadialGradient(rp.x, rp.y, 0, rp.x, rp.y, Math.max(1, flashR));
                    g.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    canvasCtx.fillStyle = g;
                    canvasCtx.beginPath();
                    canvasCtx.arc(rp.x, rp.y, Math.max(1, flashR), 0, Math.PI * 2);
                    canvasCtx.fill();
                }

                const dampenMain = 16 * Math.exp(-radius / 480) + 3;
                canvasCtx.save();
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = `rgba(200,235,255,${0.75 * fade})`;
                buildRipplePath(canvasCtx, rp.x, rp.y, radius, t, rp.seed, dampenMain);
                canvasCtx.stroke();

                canvasCtx.lineWidth = 1;
                canvasCtx.strokeStyle = `rgba(255,255,255,${0.6 * fade})`;
                buildRipplePath(canvasCtx, rp.x, rp.y, radius + 4, t, rp.seed + 1, dampenMain * 0.6);
                canvasCtx.stroke();
                canvasCtx.restore();

                [0.82, 0.64, 0.46].forEach((frac, idx) => {
                    const rr = radius * frac;
                    if (rr < 10) return;
                    const ringAlpha = 0.28 * fade * (1 - idx * 0.25);
                    const dampenRing = dampenMain * (0.7 - idx * 0.15);
                    canvasCtx.save();
                    canvasCtx.lineWidth = 1.4;
                    canvasCtx.strokeStyle = `rgba(190,225,255,${Math.max(0, ringAlpha)})`;
                    buildRipplePath(canvasCtx, rp.x, rp.y, rr, t * 0.8, rp.seed + idx + 2, dampenRing);
                    canvasCtx.stroke();
                    canvasCtx.restore();
                });
            }
        }
        // --- ƏLAVƏ SONU ---

        function setupCanvas(video) {
            if (outputCanvas.width !== video.videoWidth || outputCanvas.height !== video.videoHeight) {
                outputCanvas.width = video.videoWidth;
                outputCanvas.height = video.videoHeight;
                bgCanvas.width = video.videoWidth;
                bgCanvas.height = video.videoHeight;
            }
        }

        // 1. Hands Modulu
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(results => {
            latestHandsResults = results;
        });

        // 2. Selfie Segmentation Modulu
        const selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });
        selfieSegmentation.setOptions({
            modelSelection: 1
        });
        selfieSegmentation.onResults(results => {
            latestSegmentationResults = results;
            drawFrame();
        });

        // Hər kadrda işləyən əsas çəkim funksiyası
        function drawFrame() {
            if (videoElement.paused || videoElement.ended) return;

            setupCanvas(videoElement);

            // Arxa fonu ilk kadrda avtomatik tuturuq
            if (!backgroundCaptured && videoElement.videoWidth > 0) {
                bgCtx.drawImage(videoElement, 0, 0, bgCanvas.width, bgCanvas.height);
                bgImage = bgCtx.getImageData(0, 0, bgCanvas.width, bgCanvas.height);
                backgroundCaptured = true;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            // Əgər şüşə effekti aktiv deyilse və ya arxa fon yoxdursa - sadəcə kameranı göstər
            if (!isGlassActive || !backgroundCaptured || !bgImage || !latestSegmentationResults) {
                canvasCtx.drawImage(videoElement, 0, 0, outputCanvas.width, outputCanvas.height);
            } else {
                // 1. Əvvəlcə arxa fonu çəkirik
                canvasCtx.putImageData(bgImage, 0, 0);

                // 2. Şüşə / Şəffaf siluet effekti (Daha da şəffaf edilib: 0.1)
                canvasCtx.save();
                canvasCtx.globalAlpha = 0.1; 
                canvasCtx.drawImage(videoElement, 0, 0, outputCanvas.width, outputCanvas.height);
                
                // Şüşənin parıltı rəngi
                canvasCtx.fillStyle = "rgba(120, 200, 255, 0.05)";
                canvasCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
                canvasCtx.restore();

                // 3. Sizi izləyən yaşıl nazik xətli kvadrat (Bədənin olduğu koordinatlara görə dinamik hesablanır)
                if (latestSegmentationResults.segmentationMask) {
                    canvasCtx.save();
                    
                    // Maskanı analiz edərək sizin (bədənin) yerinizi tapırıq
                    const mask = latestSegmentationResults.segmentationMask;
                    const width = mask.width;
                    const height = mask.height;
                    const canvasW = outputCanvas.width;
                    const canvasH = outputCanvas.height;

                    let minX = width, minY = height, maxX = 0, maxY = 0;
                    let hasBody = false;

                    // Maskanın piksel datalarından istifadə edərək sərhədləri tapırıq
                    // Qeyd: Mediapipe maskası Canvas üzərindən oxunur
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(mask, 0, 0);
                    const imgData = tempCtx.getImageData(0, 0, width, height).data;

                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const alphaIdx = (y * width + x) * 4 + 3;
                            if (imgData[alphaIdx] > 50) { // Əgər bu pikseldə insan varsa
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                hasBody = true;
                            }
                        }
                    }

                    if (hasBody && maxX > minX && maxY > minY) {
                        // Koordinatları ekran ölçülərinə uyğunlaşdırırıq
                        const scaleX = canvasW / width;
                        const scaleY = canvasH / height;

                        const boxX = minX * scaleX - 20; // Bir az kənar boşluq ilə
                        const boxY = minY * scaleY - 20;
                        const boxW = (maxX - minX) * scaleX + 40;
                        const boxH = (maxY - minY) * scaleY + 40;

                        canvasCtx.strokeStyle = "#00FF00";
                        canvasCtx.lineWidth = 2; // Nazik yaşıl xətt
                        canvasCtx.strokeRect(boxX, boxY, boxW, boxH);
                    }
                    canvasCtx.restore();
                }
            }

            // Barmaq toxunmasını yoxlayırıq (Toggle)
            let isTouchingNow = false;
            let touchX = 0, touchY = 0;
            if (latestHandsResults && latestHandsResults.multiHandLandmarks && latestHandsResults.multiHandLandmarks.length > 0) {
                const lm = latestHandsResults.multiHandLandmarks[0];
                const x1 = lm[4].x * outputCanvas.width;
                const y1 = lm[4].y * outputCanvas.height;
                const x2 = lm[8].x * outputCanvas.width;
                const y2 = lm[8].y * outputCanvas.height;
                touchX = (x1 + x2) / 2;
                touchY = (y1 + y2) / 2;

                if (Math.hypot(x2 - x1, y2 - y1) < 40) {
                    isTouchingNow = true;
                }
            }

            if (wasTouching && !isTouchingNow) {
                isGlassActive = !isGlassActive; // Statusu dəyişir (Aç/Bağla)
                // ƏLAVƏ: toxunma nöqtəsindən su dalğası doğulur
                ripples.push({ x: touchX, y: touchY, start: performance.now(), seed: Math.random() * 1000 });
            }
            wasTouching = isTouchingNow;

            // ƏLAVƏ: su dalğalarını cizirik
            drawRipples(performance.now());

            canvasCtx.restore();
        }

        // 3. Kamera və Model İcraçısı
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
                await selfieSegmentation.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch(err => {
            console.error("Kamera xətası:", err);
            alert("Kameraya giriş icazəsi verilmədi və ya kamera başqa proqram tərəfindən istifadə olunur!");
        });
    </script>
</body>
</html>
