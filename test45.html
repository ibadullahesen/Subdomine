function starPointTexture(warm){
  const c = document.createElement('canvas'); c.width=c.height=64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  if(warm){
    g.addColorStop(0,'rgba(255,245,220,1)');
    g.addColorStop(0.15,'rgba(255,230,180,0.8)');
    g.addColorStop(0.5,'rgba(255,200,120,0.2)');
  } else {
    g.addColorStop(0,'rgba(220,235,255,1)');
    g.addColorStop(0.15,'rgba(180,210,255,0.8)');
    g.addColorStop(0.5,'rgba(120,160,255,0.2)');
  }
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = warm ? 'rgba(255,220,160,0.15)' : 'rgba(180,210,255,0.15)';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(32,0); ctx.lineTo(32,64); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,32); ctx.lineTo(64,32); ctx.stroke();
  return new THREE.CanvasTexture(c);
}

function milkyWayTexture(){
  const c = document.createElement('canvas'); c.width=1024; c.height=256;
  const ctx = c.getContext('2d');
  for(let i=0;i<8000;i++){
    const x = Math.random()*1024;
    const y = 128 + (Math.random()-0.5)*160 * Math.exp(-Math.pow((x-512)/300,2));
    const r = Math.random()*2.5+0.3;
    const a = Math.random()*0.4+0.1;
    const hue = 210 + Math.random()*40;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `hsla(${hue},30%,80%,${a})`;
    ctx.fill();
  }
  for(let i=0;i<3000;i++){
    const x = Math.random()*1024;
    const y = 128 + (Math.random()-0.5)*60 * Math.exp(-Math.pow((x-512)/250,2));
    const r = Math.random()*1.5+0.2;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,250,240,${Math.random()*0.25+0.05})`;
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function glowTexture(hue, sat, light, alpha){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, `hsla(${hue},${sat}%,${light}%,${alpha})`);
  g.addColorStop(0.3, `hsla(${hue},${sat}%,${light-10}%,${alpha*0.6})`);
  g.addColorStop(0.6, `hsla(${hue},${sat}%,${light-20}%,${alpha*0.2})`);
  g.addColorStop(1, `hsla(${hue},${sat}%,${light-25}%,0)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

function rockTexture(shade){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `hsl(25,10%,${shade}%)`; ctx.fillRect(0,0,256,256);
  for(let i=0;i<300;i++){
    const x=Math.random()*256, y=Math.random()*256, r=Math.random()*5+0.5;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `hsla(25,10%,${shade-8-Math.random()*12}%,0.5)`;
    ctx.fill();
  }
  ctx.strokeStyle = `hsla(25,8%,${shade-15}%,0.3)`;
  ctx.lineWidth = 0.5;
  for(let i=0;i<12;i++){
    ctx.beginPath();
    let x=Math.random()*256, y=Math.random()*256;
    ctx.moveTo(x,y);
    for(let j=0;j<5;j++){ x+=(Math.random()-0.5)*40; y+=(Math.random()-0.5)*40; ctx.lineTo(x,y); }
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function gridTexture(){
  const c = document.createElement('canvas'); c.width=1024; c.height=512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,1024,512);
  ctx.strokeStyle = 'rgba(80,200,255,0.3)';
  ctx.lineWidth = 0.8;
  for(let x=0;x<=1024;x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,512); ctx.stroke(); }
  for(let y=0;y<=512;y+=64){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(1024,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(100,240,255,0.7)';
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(0,256); ctx.lineTo(1024,256); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(512,0); ctx.lineTo(512,512); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,200,255,0.2)';
  ctx.lineWidth = 0.6;
  ctx.setLineDash([4,8]);
  ctx.beginPath(); ctx.moveTo(0,128); ctx.lineTo(1024,128); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,384); ctx.lineTo(1024,384); ctx.stroke();
  ctx.setLineDash([]);
  return new THREE.CanvasTexture(c);
}

const starLayers = [];
function makeStarLayer(count, spreadXY, zFrom, zTo, size, opacity, warmChance, twinkle){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]=(Math.random()-0.5)*spreadXY;
    pos[i*3+1]=(Math.random()-0.5)*spreadXY;
    pos[i*3+2]= -(zFrom + Math.random()*(zTo-zFrom));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const useWarm = Math.random() < warmChance;
  const mat = new THREE.PointsMaterial({
    size: Math.max(0.3, size), map: starPointTexture(useWarm),
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    color: useWarm ? 0xffe8c0 : 0xd0e0ff, opacity
  });
  const points = new THREE.Points(geo, mat);
  points.userData.twinkle = twinkle;
  points.userData.baseOpacity = opacity;
  scene.add(points);
  return points;
}

  const geo = new THREE.SphereGeometry(gd.r,64,64);
  const mat = new THREE.MeshPhongMaterial({color:gd.color, shininess:8, specular:0x222211});
  if(gd.tex) safeLoad('https://threejs.org/examples/textures/planets/'+gd.tex, gd.color, mat);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(gd.x, gd.y, -gd.z);
  m.userData.spin = 0.002;
  scene.add(m);
  if(!gd.tex){
    const bc = document.createElement('canvas'); bc.width=256; bc.height=128;
    const bctx = bc.getContext('2d');
    const baseColor = new THREE.Color(gd.color);
    const hsl = {}; baseColor.getHSL(hsl);
    for(let y=0;y<128;y++){
      const bH = hsl.h*360+(Math.sin(y*0.3)*0.02*360)+(Math.sin(y*0.7)*0.01*360);
      const bS = hsl.s*100*(0.7+0.3*Math.sin(y*0.15));
      const bL = hsl.l*100*(0.8+0.2*Math.sin(y*0.2+1));
      bctx.fillStyle = `hsl(${bH},${bS}%,${bL}%)`;
      bctx.fillRect(0,y,256,1);
    }
    mat.map = new THREE.CanvasTexture(bc);
    mat.needsUpdate = true;
  }
  if(gd.ringColor){
    const ringInner = gd.r*1.4, ringOuter = gd.r*2.2;
    const ringGeo = new THREE.RingGeometry(ringInner, ringOuter, 64);
    const rc = document.createElement('canvas'); rc.width=256; rc.height=16;
    const rctx = rc.getContext('2d');
    const ringCol = new THREE.Color(gd.ringColor);
    const rhsl = {}; ringCol.getHSL(rhsl);
    for(let x=0;x<256;x++){
      const t = x/256;
      const a = (0.3+0.4*Math.sin(t*20))*(1-Math.pow(Math.abs(t-0.5)*2,3));
      rctx.fillStyle = `hsla(${rhsl.h*360},${rhsl.s*100}%,${rhsl.l*100}%,${a})`;
      rctx.fillRect(x,0,1,16);
    }
    const ringMat = new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(rc), transparent:true, opacity:0.55, side:THREE.DoubleSide, depthWrite:false});
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2.2;
    ring.position.copy(m.position);
    scene.add(ring);
  }
  const moonCount = 1+Math.floor(Math.random()*3);
  for(let i=0;i<moonCount;i++){
    const moonR = 8+Math.random()*20;
    const moonGeo = new THREE.SphereGeometry(moonR,24,24);

    moon.userData.orbitAngle = angle;
    moon.userData.orbitDist = dist;
    moon.userData.orbitCenter = new THREE.Vector3(gd.x, gd.y, -gd.z);
    moon.userData.orbitSpeed = 0.0003+Math.random()*0.0005;
    moon.userData.orbitTilt = (Math.random()-0.5)*0.3;
    scene.add(moon);
    allAsteroids.push(moon);

function latLongToVec3(lat, lon, radius){
  const phi = (90-lat)*Math.PI/180;
  const theta = (lon+180)*Math.PI/180;
  return new THREE.Vector3(-radius*Math.sin(phi)*Math.cos(theta), radius*Math.cos(phi), radius*Math.sin(phi)*Math.sin(theta));
}
const markerTex = glowTexture(50,95,80,1);

  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:markerTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  spr.scale.set(14,14,1); spr.position.copy(pos); earthGroup.add(spr);
  const pulse = new THREE.Sprite(new THREE.SpriteMaterial({map:markerPulseTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  pulse.scale.set(14,14,1); pulse.position.copy(pos); pulse.userData.pulsePhase = Math.random()*Math.PI*2;
  earthGroup.add(pulse);
  markers.push({dot:spr, pulse, lat, lon, pos:pos.clone()});
}

// Controls
let velocity = 0;
const MAX_VELOCITY = 700;
const FRICTION = 0.988;

window.addEventListener('wheel', (e)=>{
  velocity += e.deltaY * 1.7;
  velocity = Math.max(-260, Math.min(MAX_VELOCITY, velocity));
}, {passive:true});

let touchY = null;
window.addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchmove', e=>{
  const y = e.touches[0].clientY;
  velocity += (touchY - y) * 5.5;
  velocity = Math.max(-260, Math.min(MAX_VELOCITY, velocity));
  touchY = y;
}, {passive:true});

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key===' ') velocity = Math.min(MAX_VELOCITY, velocity+160);
  if(e.key==='ArrowUp') velocity = Math.max(-260, velocity-160);
});

let mouseX=0, mouseY=0;
window.addEventListener('mousemove', e=>{
  mouseX = (e.clientX/window.innerWidth - 0.5);
  mouseY = (e.clientY/window.innerHeight - 0.5);
});

// Map
const MAP_ZONES = [
  {name:'Asteroid I',z:1200,color:'#aa8866'},
  {name:'Qaz nəhəngi \u03b1',z:1800,color:'#d4a86a'},
  {name:'Qurd dəliyi I',z:2100,color:'#6688dd'},
  {name:'Asteroid II',z:2800,color:'#aa8866'},
  {name:'Qaz nəhəngi \u03b2',z:4400,color:'#b89870'},
  {name:'Asteroid III',z:4500,color:'#aa8866'},
  {name:'Qurd dəliyi II',z:5800,color:'#8866cc'},
  {name:'Asteroid IV',z:6200,color:'#aa8866'},
  {name:'Qaz nəhəngi \u03b3',z:7200,color:'#9a8868'},
  {name:'Asteroid V',z:7800,color:'#aa8866'},
  {name:'Asteroid VI',z:8800,color:'#aa8866'},
  {name:'YER',z:EARTHZ,color:'#4499ff'},
];

function drawMap(depth, t){
  const w=520, h=520;
  mapCtx.clearRect(0,0,w,h);
  mapCtx.fillStyle = 'rgba(2,6,18,0.95)';
  mapCtx.fillRect(0,0,w,h);
  const margin = 40;
  const routeH = h - margin*2;
  // route line
  mapCtx.strokeStyle = 'rgba(80,160,255,0.15)';
  mapCtx.lineWidth = 1.5;
  mapCtx.setLineDash([3,3]);
  mapCtx.beginPath();
  mapCtx.moveTo(w/2, margin);
  mapCtx.lineTo(w/2, h-margin);
  mapCtx.stroke();
  mapCtx.setLineDash([]);
  // nebula bands
  for(const nd of NEBULA_DATA){
    const zy = margin + (nd.z/EARTHZ)*routeH;
    mapCtx.fillStyle = `hsla(${nd.h},${nd.s}%,${nd.l+20}%,0.06)`;
    mapCtx.fillRect(w/2-50, zy-12, 100, 24);
  }
  // zone markers
  for(const zone of MAP_ZONES){
    const zy = margin + (zone.z/EARTHZ)*routeH;
    mapCtx.fillStyle = zone.color;
    mapCtx.globalAlpha = 0.6;
    mapCtx.beginPath();
    mapCtx.arc(w/2, zy, 3, 0, Math.PI*2);
    mapCtx.fill();
    mapCtx.globalAlpha = 0.4;
    mapCtx.font = '14px Courier New';
    mapCtx.textAlign = 'left';
    mapCtx.fillText(zone.name, w/2+14, zy+4);
    mapCtx.globalAlpha = 1;
  }
  // scan line
  const curY = margin + (depth/EARTHZ)*routeH;
  mapCtx.strokeStyle = 'rgba(100,220,255,0.12)';
  mapCtx.lineWidth = 1;
  mapCtx.beginPath();
  mapCtx.moveTo(15, curY);
  mapCtx.lineTo(w-15, curY);
  mapCtx.stroke();
  // ship dot
  const pulseR = 7+Math.sin(t*4)*3;
  const sg = mapCtx.createRadialGradient(w/2, curY, 0, w/2, curY, pulseR*2);
  sg.addColorStop(0,'rgba(100,240,255,0.9)');
  sg.addColorStop(0.5,'rgba(80,200,255,0.3)');
  sg.addColorStop(1,'rgba(60,160,255,0)');
  mapCtx.fillStyle = sg;
  mapCtx.fillRect(w/2-pulseR*2, curY-pulseR*2, pulseR*4, pulseR*4);
  mapCtx.fillStyle = '#80e8ff';
  mapCtx.beginPath();
  mapCtx.arc(w/2, curY, 3, 0, Math.PI*2);
  mapCtx.fill();
}

// Speed FX
function drawSpeedFX(speedNorm){
  fxCtx.clearRect(0,0,fx.width,fx.height);
  const cx = fx.width/2, cy = fx.height/2;
  if(speedNorm>0.02){
    const n = Math.floor(speedNorm*55);
    fxCtx.save();
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const r0 = 40+Math.random()*60;
      const r1 = r0+80+speedNorm*350;
      const a = Math.min(0.4, speedNorm*0.5)*(0.3+Math.random()*0.7);
      const blue = Math.floor(200+speedNorm*55);
      fxCtx.strokeStyle = `rgba(${200-speedNorm*60},${220-speedNorm*40},${blue},${a})`;
      fxCtx.lineWidth = 0.4+Math.random()*1.4*(1-speedNorm*0.3);
      fxCtx.beginPath();
      fxCtx.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0);
      fxCtx.lineTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
      fxCtx.stroke();
    }
    if(speedNorm>0.6){
      const flashA = (speedNorm-0.6)*0.3;
      const fg = fxCtx.createRadialGradient(cx,cy,0,cx,cy,100);
      fg.addColorStop(0,`rgba(180,220,255,${flashA})`);
      fg.addColorStop(1,'rgba(100,160,255,0)');
      fxCtx.fillStyle = fg;
      fxCtx.fillRect(cx-100,cy-100,200,200);
    }
    fxCtx.restore();
  }
  const vigStr = 0.3+speedNorm*0.4;
  const g = fxCtx.createRadialGradient(cx,cy,fx.height*0.25, cx,cy, fx.height*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,`rgba(0,0,0,${vigStr})`);
  fxCtx.fillStyle = g;
  fxCtx.fillRect(0,0,fx.width,fx.height);
  if(speedNorm>0.3){
    const ba = (speedNorm-0.3)*0.08;
    fxCtx.fillStyle = `rgba(40,80,180,${ba})`;
    fxCtx.fillRect(0,0,fx.width,fx.height);
  }
}

// Animate
let depth = 0, t = 0;
function animate(){
  t += 0.016;
  velocity *= FRICTION;
  depth += velocity * 0.016;
  depth = Math.max(0, depth);
  if(depth >= MAX_DEPTH){ depth = MAX_DEPTH; if(velocity>0) velocity = 0; }
  const camZ = -depth;
  const speedNorm = Math.min(1, Math.abs(velocity)/MAX_VELOCITY);
  const distToEarth = EARTHZ - depth;
  // Map only when very close to Earth
  const mapThreshold = EARTH_RADIUS * 2.2;
  if(distToEarth < mapThreshold){
    mapEl.classList.add('show');
    drawMap(depth, t);
  } else {
    mapEl.classList.remove('show');
  }

  camera.fov = BASE_FOV + speedNorm*22;
  camera.updateProjectionMatrix();
  camera.position.z = camZ;
  camera.position.x += ((Math.sin(t*0.11)*4 + mouseX*12) - camera.position.x)*0.04;
  camera.position.y += ((Math.cos(t*0.08)*3 + mouseY*7) - camera.position.y)*0.04;
  camera.rotation.z = Math.sin(t*0.06)*0.012 - speedNorm*0.008;
  camera.lookAt(camera.position.x*0.3, camera.position.y*0.3, camZ - 250);

  torch.position.copy(camera.position);
  torch.position.z -= 18;

  earthMesh.rotation.y += 0.0008;
  nightMesh.rotation.y += 0.0008;
  cloudsMesh.rotation.y += 0.0013;
  gridMesh.rotation.y += 0.0008;

  for(const m of markers){
    const s = 14+Math.sin(t*2.5+m.pulse.userData.pulsePhase)*6;
    m.pulse.scale.set(s, s, 1);
    m.pulse.material.opacity = 0.3+0.2*Math.sin(t*2.5+m.pulse.userData.pulsePhase);
  }

  moonOrbit.position.x = EARTH_RADIUS*2.8+Math.sin(t*0.05)*50;
  moonOrbit.position.z = -EARTH_RADIUS*1.5+Math.cos(t*0.05)*50;

  for(const layer of starLayers){
    if(layer.userData.twinkle) layer.material.opacity = layer.userData.baseOpacity*(0.85+0.15*Math.sin(t*1.5+layer.id));
  }
  for(const s of brightStars){
    const sc = s.userData.baseScale*(0.8+0.2*Math.sin(t*s.userData.twinkleSpeed+s.userData.twinklePhase));
    s.scale.set(sc, sc, 1);
  }

  for(const c of comets){
    c.position.addScaledVector(c.userData.vel, 0.016);
    c.rotation.z = c.userData.rotZ;
    if(Math.abs(c.position.x)>1000) c.userData.vel.x *= -1;
    if(Math.abs(c.position.y)>600) c.userData.vel.y *= -1;
  }

  for(const a of allAsteroids){
    if(a.userData.spin instanceof THREE.Vector3){
      a.rotation.x += a.userData.spin.x;
      a.rotation.y += a.userData.spin.y;
      a.rotation.z += a.userData.spin.z;
    }
    if(a.userData.orbitSpeed){
      a.userData.orbitAngle += a.userData.orbitSpeed;
      const oc = a.userData.orbitCenter, od = a.userData.orbitDist;
      a.position.x = oc.x+Math.cos(a.userData.orbitAngle)*od;
      a.position.z = oc.z+Math.sin(a.userData.orbitAngle)*od;
      a.position.y = oc.y+Math.sin(a.userData.orbitAngle)*od*a.userData.orbitTilt;
    }
  }

  scene.traverse(obj=>{
    if(obj.userData && typeof obj.userData.spin === 'number') obj.rotation.y += obj.userData.spin;
  });

  drawSpeedFX(speedNorm);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
