  #fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x010208, 0.00022);
const BASE_FOV = 55;
const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth/window.innerHeight, 0.1, 15000);

const fx = document.getElementById('fx');
const fxCtx = fx.getContext('2d');

function resize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fx.width = window.innerWidth; fx.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
setTimeout(()=>{ document.getElementById('fade').style.opacity = 0; }, 400);

scene.add(new THREE.AmbientLight(0x080c18, 0.25));
scene.add(new THREE.HemisphereLight(0x223344, 0x030308, 0.2));
const torch = new THREE.PointLight(0x8fb0ff, 0.25, 150, 2);
scene.add(torch);

const EARTHZ = 9600;
const EARTH_RADIUS = 950;
const MAX_DEPTH = EARTHZ - EARTH_RADIUS - 18;

const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';
function safeLoad(url, fallbackColor, mat){
  loader.load(url, (tex)=>{ mat.map = tex; mat.needsUpdate = true; },
    undefined, ()=>{ mat.color = new THREE.Color(fallbackColor); mat.needsUpdate = true; });
}

function starTex(warm){
  const c = document.createElement('canvas'); c.width=c.height=32;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  if(warm){ g.addColorStop(0,'rgba(255,248,230,1)'); g.addColorStop(0.2,'rgba(255,235,190,0.6)'); g.addColorStop(0.6,'rgba(255,210,140,0.1)'); }
  else { g.addColorStop(0,'rgba(230,240,255,1)'); g.addColorStop(0.2,'rgba(200,220,255,0.6)'); g.addColorStop(0.6,'rgba(150,180,255,0.1)'); }
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(c);
}

function brightStarTex(warm){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,50);
  if(warm){ g.addColorStop(0,'rgba(255,250,235,1)'); g.addColorStop(0.15,'rgba(255,230,180,0.7)'); g.addColorStop(0.5,'rgba(255,200,120,0.15)'); }
  else { g.addColorStop(0,'rgba(235,245,255,1)'); g.addColorStop(0.15,'rgba(200,225,255,0.7)'); g.addColorStop(0.5,'rgba(150,190,255,0.15)'); }
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  ctx.globalCompositeOperation = 'lighter';
  const col = warm ? 'rgba(255,230,180,' : 'rgba(200,225,255,';
  for(let ang=0;ang<4;ang++){
    const a = ang*Math.PI/2;
    const dx = Math.cos(a), dy = Math.sin(a);
    const grad = ctx.createLinearGradient(64-dx*55,64-dy*55,64+dx*55,64+dy*55);
    grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(0.35,col+'0.05)'); grad.addColorStop(0.5,col+'0.3)'); grad.addColorStop(0.65,col+'0.05)'); grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = warm ? 1.2 : 1;
    ctx.beginPath(); ctx.moveTo(64-dx*55,64-dy*55); ctx.lineTo(64+dx*55,64+dy*55); ctx.stroke();
  }
  for(let ang=0;ang<4;ang++){
    const a = ang*Math.PI/2 + Math.PI/4;
    const dx = Math.cos(a), dy = Math.sin(a);
    const grad = ctx.createLinearGradient(64-dx*35,64-dy*35,64+dx*35,64+dy*35);
    grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(0.4,col+'0.08)'); grad.addColorStop(0.5,col+'0.18)'); grad.addColorStop(0.6,col+'0.08)'); grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(64-dx*35,64-dy*35); ctx.lineTo(64+dx*35,64+dy*35); ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function milkyWayTexture(){
  const c = document.createElement('canvas'); c.width=2048; c.height=512;
  const ctx = c.getContext('2d');
  for(let i=0;i<20000;i++){
    const x = Math.random()*2048;
    const y = 256 + (Math.random()-0.5)*200 * Math.exp(-Math.pow((x-1024)/400,2));
    ctx.beginPath(); ctx.arc(x,y,Math.random()*1.8+0.2,0,Math.PI*2);
    ctx.fillStyle = `hsla(${210+Math.random()*50},25%,${70+Math.random()*25}%,${Math.random()*0.35+0.08})`;
    ctx.fill();
  }
  for(let i=0;i<2000;i++){
    const x = Math.random()*2048;
    const y = 256 + (Math.random()-0.5)*80 * Math.exp(-Math.pow((x-1024)/350,2));
    ctx.beginPath(); ctx.arc(x,y,Math.random()*1+0.3,0,Math.PI*2);
    ctx.fillStyle = `rgba(200,220,255,${Math.random()*0.3+0.1})`;
    ctx.fill();
  }
  for(let i=0;i<5000;i++){
    const x = Math.random()*2048;
    const y = 256 + (Math.random()-0.5)*350 * Math.exp(-Math.pow((x-1024)/500,2));
    ctx.beginPath(); ctx.arc(x,y,Math.random()*3+1,0,Math.PI*2);
    ctx.fillStyle = `rgba(180,200,240,${Math.random()*0.04+0.01})`;
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function glowTexture(hue, sat, light, alpha){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, `hsla(${hue},${sat}%,${light}%,${alpha})`);
  g.addColorStop(0.25, `hsla(${hue},${sat}%,${light-8}%,${alpha*0.55})`);
  g.addColorStop(0.55, `hsla(${hue},${sat}%,${light-18}%,${alpha*0.15})`);
  g.addColorStop(1, `hsla(${hue},${sat}%,${light-22}%,0)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

function rockTexture(shade){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `hsl(25,10%,${shade}%)`; ctx.fillRect(0,0,256,256);
  for(let i=0;i<250;i++){
    ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*256,Math.random()*5+0.5,0,Math.PI*2);
    ctx.fillStyle = `hsla(25,10%,${shade-8-Math.random()*12}%,0.5)`;
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function gridTexture(){
  const c = document.createElement('canvas'); c.width=1024; c.height=512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,1024,512);
  ctx.strokeStyle = 'rgba(80,200,255,0.25)'; ctx.lineWidth = 0.6;
  for(let x=0;x<=1024;x+=64){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,512); ctx.stroke(); }
  for(let y=0;y<=512;y+=64){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(1024,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(100,240,255,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0,256); ctx.lineTo(1024,256); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(512,0); ctx.lineTo(512,512); ctx.stroke();
  return new THREE.CanvasTexture(c);
}

// ===== WORMHOLE PLASMA TEXTURE =====
function wormholePlasmaTex(hue){
  const c = document.createElement('canvas'); c.width=512; c.height=512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `hsl(${hue},60%,3%)`;
  ctx.fillRect(0,0,512,512);
  // Plasma tendrils
  for(let i=0;i<60;i++){
    ctx.beginPath();
    let x = Math.random()*512;
    let y = Math.random()*512;
    ctx.moveTo(x,y);
    for(let j=0;j<8;j++){
      x += (Math.random()-0.5)*80;
      y += (Math.random()-0.5)*80;
      ctx.lineTo(x,y);
    }
    const h2 = hue + (Math.random()-0.5)*30;
    ctx.strokeStyle = `hsla(${h2},80%,${50+Math.random()*20}%,${0.15+Math.random()*0.25})`;
    ctx.lineWidth = 1+Math.random()*4;
    ctx.stroke();
  }
  // Hot bright knots
  for(let i=0;i<30;i++){
    const x=Math.random()*512, y=Math.random()*512;
    const r = 5+Math.random()*20;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `hsla(${hue+10},90%,85%,0.6)`);
    g.addColorStop(0.4, `hsla(${hue},80%,60%,0.2)`);
    g.addColorStop(1, `hsla(${hue},70%,40%,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  return new THREE.CanvasTexture(c);
}

// ===== MILKY WAY =====
const mwPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 1500),
  new THREE.MeshBasicMaterial({map:milkyWayTexture(), transparent:true, opacity:0.8, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide})
);
mwPlane.rotation.x = Math.PI/2.2; mwPlane.rotation.z = 0.25;
mwPlane.position.set(0, 250, -EARTHZ/2);
scene.add(mwPlane);

// ===== STARS =====
const starLayers = [];
function makeStars(count, spreadXY, zFrom, zTo, size, opacity, warmRatio){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]=(Math.random()-0.5)*spreadXY;
    pos[i*3+1]=(Math.random()-0.5)*spreadXY;
    pos[i*3+2]= -(zFrom + Math.random()*(zTo-zFrom));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const warm = Math.random() < warmRatio;
  const mat = new THREE.PointsMaterial({
    size: Math.max(0.2, size), map: starTex(warm),
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    color: warm ? 0xffecd0 : 0xdce8ff, opacity
  });
  const pts = new THREE.Points(geo, mat);
  pts.userData.baseOpacity = opacity; pts.userData.id = Math.random()*100;
  scene.add(pts); starLayers.push(pts);
}
makeStars(8000, 4000, 0, EARTHZ+2000, 0.5, 0.2, 0.15);
makeStars(6000, 2800, 0, EARTHZ+1000, 0.8, 0.35, 0.2);
makeStars(4000, 1600, 0, EARTHZ, 1.2, 0.5, 0.25);
makeStars(2500, 900, 0, EARTHZ*0.8, 1.8, 0.7, 0.3);
makeStars(1000, 500, 0, EARTHZ*0.5, 2.8, 0.9, 0.35);

// Bright stars
function makeBrightStars(count, spreadXY, zRange, sizeRange){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const cols = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]=(Math.random()-0.5)*spreadXY;
    pos[i*3+1]=(Math.random()-0.5)*spreadXY;
    pos[i*3+2]= -(Math.random()*zRange+100);
    const warm = Math.random()>0.5;
    if(warm){ cols[i*3]=1; cols[i*3+1]=0.92; cols[i*3+2]=0.75; }
    else { cols[i*3]=0.85; cols[i*3+1]=0.92; cols[i*3+2]=1; }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  const mat = new THREE.PointsMaterial({
    size: sizeRange[1], map: brightStarTex(false),
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexColors:true, opacity:0.95
  });
  scene.add(new THREE.Points(geo, mat));
}
makeBrightStars(30, 3000, EARTHZ, [5,12]);
makeBrightStars(15, 1500, EARTHZ*0.6, [8,18]);

// ===== NEBULAE =====
const NEBULA_DATA = [
  {z:500,x:100,y:50,h:220,s:45,l:22,spread:400},{z:1400,x:-200,y:120,h:275,s:35,l:20,spread:450},
  {z:2200,x:60,y:-90,h:345,s:40,l:24,spread:350},{z:3100,x:-140,y:30,h:175,s:50,l:22,spread:420},
  {z:4000,x:180,y:-60,h:12,s:45,l:23,spread:380},{z:4900,x:-50,y:140,h:235,s:40,l:21,spread:400},
  {z:5800,x:130,y:-110,h:295,s:35,l:19,spread:450},{z:6700,x:-180,y:50,h:195,s:45,l:23,spread:370},
  {z:7600,x:40,y:-30,h:155,s:40,l:21,spread:350},{z:8500,x:-100,y:70,h:28,s:42,l:22,spread:400},
];
for(const nd of NEBULA_DATA){
  const cz = -nd.z;
  for(let i=0;i<15;i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(nd.h+(Math.random()*20-10), nd.s-12, nd.l-8, 0.15),
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    spr.scale.set(nd.spread*0.6+Math.random()*nd.spread*0.8, nd.spread*0.3+Math.random()*nd.spread*0.5, 1);
    spr.material.rotation = Math.random()*Math.PI;
    spr.position.set(nd.x+(Math.random()-0.5)*nd.spread*1.8, nd.y+(Math.random()-0.5)*nd.spread*1.2, cz+(Math.random()-0.5)*nd.spread*1.8);
    scene.add(spr);
  }
  for(let i=0;i<8;i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(nd.h+8, nd.s+10, nd.l+18, 0.35),
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    spr.scale.set(80+Math.random()*200, 15+Math.random()*30, 1);
    spr.material.rotation = Math.random()*Math.PI;
    spr.position.set(nd.x+(Math.random()-0.5)*nd.spread, nd.y+(Math.random()-0.5)*nd.spread*0.6, cz+(Math.random()-0.5)*nd.spread);
    scene.add(spr);
  }
  for(let i=0;i<4;i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(nd.h, nd.s+20, nd.l+35, 0.5),
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    const s = 15+Math.random()*35;
    spr.scale.set(s, s*0.7, 1);
    spr.position.set(nd.x+(Math.random()-0.5)*nd.spread*0.5, nd.y+(Math.random()-0.5)*nd.spread*0.3, cz+(Math.random()-0.5)*nd.spread*0.5);
    scene.add(spr);
  }
}

// ===== ASTEROIDS =====
const rockGeo = new THREE.DodecahedronGeometry(1,1);
const rockGeo2 = new THREE.IcosahedronGeometry(1,1);
const ASTER_Z = [1200,2800,4500,6200,7800,8800];
const allAsteroids = [];
for(let k=0;k<ASTER_Z.length;k++){
  const tex = rockTexture(16+Math.random()*14);
  const cz = -ASTER_Z[k], cx = (Math.random()-0.5)*200, cy = (Math.random()-0.5)*160;
  for(let i=0;i<35;i++){
    const geo = Math.random()>0.5 ? rockGeo : rockGeo2;
    const mat = new THREE.MeshStandardMaterial({map:tex, roughness:0.95, metalness:0.05});
    const m = new THREE.Mesh(geo, mat);
    const s = 2+Math.random()*11;
    m.scale.set(s, s*(0.6+Math.random()*0.4), s*(0.7+Math.random()*0.3));
    m.position.set(cx+(Math.random()-0.5)*350, cy+(Math.random()-0.5)*260, cz+(Math.random()-0.5)*400);
    m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
    m.userData.spin = new THREE.Vector3((Math.random()-0.5)*0.012,(Math.random()-0.5)*0.012,(Math.random()-0.5)*0.008);
    scene.add(m); allAsteroids.push(m);
  }
}

// ===== WORMHOLE TUNNELS — PLASMA INTERIOR =====
const TUNNEL_Z = [2100, 5800];
const tunnelStarFields = [];
const tunnelSpiralGroups = [];

for(const tz of TUNNEL_Z){
  const hue = [220, 280][TUNNEL_Z.indexOf(tz)];
  const cz = -tz;

  // Plasma wall texture
  const plasmaTex = wormholePlasmaTex(hue);
  plasmaTex.wrapS = plasmaTex.wrapT = THREE.RepeatWrapping;
  plasmaTex.repeat.set(4, 4);

  // Outer plasma shell (BackSide so visible from inside)
  const shellGeo = new THREE.CylinderGeometry(60, 60, 900, 32, 1, true);
  const shellMat = new THREE.MeshBasicMaterial({
    map: plasmaTex, side: THREE.BackSide,
    transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const shell = new THREE.Mesh(shellGeo, shellMat);
  shell.rotation.x = Math.PI/2;
  shell.position.z = cz;
  shell.userData.spin = 0.004;
  scene.add(shell);

  // Inner plasma core (smaller, brighter, opposite spin)
  const coreGeo = new THREE.CylinderGeometry(25, 25, 880, 24, 1, true);
  const coreMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(`hsl(${hue+20},90%,70%)`),
    transparent: true, opacity: 0.12,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.rotation.x = Math.PI/2;
  core.position.z = cz;
  core.userData.spin = -0.006;
  scene.add(core);

  // Stars flying through the tunnel
  const tunnelStarCount = 400;
  const tsGeo = new THREE.BufferGeometry();
  const tsPos = new Float32Array(tunnelStarCount * 3);
  for(let i = 0; i < tunnelStarCount; i++){
    const angle = Math.random() * Math.PI * 2;
    const r = 10 + Math.random() * 45;
    tsPos[i*3] = Math.cos(angle) * r;
    tsPos[i*3+1] = Math.sin(angle) * r;
    tsPos[i*3+2] = cz + (Math.random() - 0.5) * 860;
  }
  tsGeo.setAttribute('position', new THREE.BufferAttribute(tsPos, 3));
  const tsMat = new THREE.PointsMaterial({
    size: 1.5, map: starTex(false),
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    color: new THREE.Color(`hsl(${hue+30},60%,90%)`),
    opacity: 0.9
  });
  const tsPoints = new THREE.Points(tsGeo, tsMat);
  scene.add(tsPoints);
  tunnelStarFields.push({ points: tsPoints, cz: cz, count: tunnelStarCount, radius: 45, length: 860 });

  // Spiral energy streams (line geometries wrapping around)
  const spiralGroup = new THREE.Group();
  spiralGroup.position.z = cz;
  for(let s = 0; s < 3; s++){
    const spiralPoints = [];
    const turns = 6;
    const steps = 200;
    const baseAngle = (s / 3) * Math.PI * 2;
    for(let i = 0; i <= steps; i++){
      const t = i / steps;
      const angle = baseAngle + t * turns * Math.PI * 2;
      const r = 20 + Math.sin(t * Math.PI * 4) * 15;
      const z = (t - 0.5) * 860;
      spiralPoints.push(new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, z));
    }
    const spiralGeo = new THREE.BufferGeometry().setFromPoints(spiralPoints);
    const spiralMat = new THREE.LineBasicMaterial({
      color: new THREE.Color(`hsl(${hue + s*15},85%,${65+s*10}%)`),
      transparent: true, opacity: 0.35,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    spiralGroup.add(new THREE.Line(spiralGeo, spiralMat));
  }
  scene.add(spiralGroup);
  tunnelSpiralGroups.push({ group: spiralGroup, speed: 0.008 + TUNNEL_Z.indexOf(tz)*0.003 });

  // Entry/exit portal glow
  for(const dz of [-450, 450]){
    // Bright ring
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(58, 2, 8, 64),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(`hsl(${hue},80%,75%)`),
        transparent: true, opacity: 0.7,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    ring.position.z = cz + dz;
    scene.add(ring);
    // Portal flash glow
    const portalGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(hue, 80, 80, 0.6),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    portalGlow.scale.set(160, 160, 1);
    portalGlow.position.z = cz + dz;
    scene.add(portalGlow);
  }
}

// ===== GAS GIANTS =====
for(const gd of [{z:1800,x:280,y:50,r:160,color:0xb8956a,tex:'jupiter2_1024.jpg',rc:0xd4c4a0},{z:4400,x:-300,y:-30,r:130,color:0x8a7a60,tex:null,rc:0xb8a880},{z:7200,x:250,y:80,r:100,color:0x7a6a55,tex:null,rc:0xa09070}]){
  const mat = new THREE.MeshPhongMaterial({color:gd.color, shininess:8, specular:0x222211});
  if(gd.tex) safeLoad('https://threejs.org/examples/textures/planets/'+gd.tex, gd.color, mat);
  const m = new THREE.Mesh(new THREE.SphereGeometry(gd.r,64,64), mat);
  m.position.set(gd.x, gd.y, -gd.z); m.userData.spin = 0.002; scene.add(m);
  if(!gd.tex){
    const bc = document.createElement('canvas'); bc.width=256; bc.height=128;
    const bctx = bc.getContext('2d');
    const hsl = {}; new THREE.Color(gd.color).getHSL(hsl);
    for(let y=0;y<128;y++){
      bctx.fillStyle = `hsl(${hsl.h*360+(Math.sin(y*0.3)*7)+(Math.sin(y*0.7)*4)},${hsl.s*100*(0.7+0.3*Math.sin(y*0.15))}%,${hsl.l*100*(0.8+0.2*Math.sin(y*0.2+1))}%)`;
      bctx.fillRect(0,y,256,1);
    }
    mat.map = new THREE.CanvasTexture(bc); mat.needsUpdate = true;
  }
  const rc = document.createElement('canvas'); rc.width=256; rc.height=16;
  const rctx = rc.getContext('2d');
  const rhsl = {}; new THREE.Color(gd.rc).getHSL(rhsl);
  for(let x=0;x<256;x++){
    const t = x/256;
    rctx.fillStyle = `hsla(${rhsl.h*360},${rhsl.s*100}%,${rhsl.l*100}%,${(0.3+0.4*Math.sin(t*20))*(1-Math.pow(Math.abs(t-0.5)*2,3))})`;
    rctx.fillRect(x,0,1,16);
  }
  const ring = new THREE.Mesh(new THREE.RingGeometry(gd.r*1.4,gd.r*2.2,64), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(rc),transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x = Math.PI/2.2; ring.position.copy(m.position); scene.add(ring);
  for(let i=0;i<1+Math.floor(Math.random()*2);i++){
    const moon = new THREE.Mesh(new THREE.SphereGeometry(8+Math.random()*20,24,24), new THREE.MeshStandardMaterial({color:0x888888,roughness:0.9}));
    const a = Math.random()*Math.PI*2, d = gd.r*2.5+Math.random()*gd.r*2;
    moon.position.set(gd.x+Math.cos(a)*d,gd.y+(Math.random()-0.5)*60,-gd.z+Math.sin(a)*d);
    moon.userData.oA=a;moon.userData.oD=d;moon.userData.oC=new THREE.Vector3(gd.x,gd.y,-gd.z);moon.userData.oS=0.0003+Math.random()*0.0005;moon.userData.oT=(Math.random()-0.5)*0.3;
    scene.add(moon); allAsteroids.push(moon);
  }
}

// ===== COMETS =====
const comets = [];
for(let i=0;i<10;i++){
  const g = new THREE.Group();
  const w = Math.random()>0.5;
  g.add(new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(w?35:210,w?80:60,90,0.9),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));
  g.children[0].scale.set(8,8,1);
  const dt = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(w?30:200,w?60:40,70,0.35),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  dt.scale.set(100,20,1); dt.position.set(-50,0,0); g.add(dt);
  const it = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(220,70,75,0.25),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  it.scale.set(160,5,1); it.position.set(-70,2,0); g.add(it);
  g.position.set((Math.random()-0.5)*800,(Math.random()-0.5)*500,-(Math.random()*EARTHZ*0.9+200));
  g.userData.vel = new THREE.Vector3((Math.random()-0.5)*5,(Math.random()-0.5)*2.5,(Math.random()-0.5)*3);
  scene.add(g); comets.push(g);
}

// ===== EARTH =====
const earthGroup = new THREE.Group();
earthGroup.position.set(0,0,-EARTHZ);
scene.add(earthGroup);

const earthMat = new THREE.MeshPhongMaterial({color:0x1a4070, shininess:18, specular:0x446688});
safeLoad('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', 0x1a4070, earthMat);
const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS,128,128), earthMat);
earthGroup.add(earthMesh);

const nightMat = new THREE.MeshBasicMaterial({transparent:true, opacity:0.6, depthWrite:false, blending:THREE.AdditiveBlending});
const nightC = document.createElement('canvas'); nightC.width=1024; nightC.height=512;
const nightCtx = nightC.getContext('2d');
nightCtx.fillStyle = '#000'; nightCtx.fillRect(0,0,1024,512);
for(const c of [[40.7,-74,8],[51.5,-0.1,10],[48.8,2.3,9],[35.6,139.7,12],[31.2,121.5,11],[39.9,116.4,10],[28.6,77.2,9],[-23.5,-46.6,7],[55.7,37.6,8],[34,-118.2,7],[22.3,114.2,9],[37.5,127,10],[1.3,103.8,7],[30,31.2,6],[-33.9,151.2,6],[19.4,-99.1,7],[13.7,100.5,8],[25.2,55.3,6],[52.5,13.4,6],[59.3,18,5],[45.5,-73.6,6],[43.7,-79.4,6],[-34.6,-58.4,6],[41,29,7]]){
  const x=(c[1]+180)/360*1024, y=(90-c[0])/180*512;
  const g = nightCtx.createRadialGradient(x,y,0,x,y,c[2]*3);
  g.addColorStop(0,'rgba(255,220,120,0.9)'); g.addColorStop(0.3,'rgba(255,200,80,0.4)'); g.addColorStop(1,'rgba(255,180,60,0)');
  nightCtx.fillStyle = g; nightCtx.fillRect(x-c[2]*3,y-c[2]*3,c[2]*6,c[2]*6);
}
nightMat.map = new THREE.CanvasTexture(nightC);
earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS*1.002,96,96), nightMat));

const cloudMat = new THREE.MeshLambertMaterial({transparent:true, opacity:0.3, depthWrite:false});
safeLoad('https://threejs.org/examples/textures/planets/earth_clouds_1024.png', 0x000000, cloudMat);
const cloudsMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS*1.012,96,96), cloudMat);
earthGroup.add(cloudsMesh);

earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS*1.003,96,96), new THREE.MeshBasicMaterial({map:gridTexture(), transparent:true, opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false})));

for(let i=0;i<3;i++){
  earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(EARTH_RADIUS*(1.04+i*0.015),48,48), new THREE.MeshBasicMaterial({color:[0x4488ff,0x6699ff,0x88bbff][i], transparent:true, opacity:Math.max(0.03,0.14-i*0.04), side:THREE.BackSide, depthWrite:false})));
}

const moonOrbitMat = new THREE.MeshStandardMaterial({color:0x999999, roughness:0.95});
safeLoad('https://threejs.org/examples/textures/planets/moon_1024.jpg', 0x999999, moonOrbitMat);
const moonOrbit = new THREE.Mesh(new THREE.SphereGeometry(180,48,48), moonOrbitMat);
moonOrbit.position.set(EARTH_RADIUS*2.8, EARTH_RADIUS*0.4, -EARTH_RADIUS*1.5);
earthGroup.add(moonOrbit);

const sunLight = new THREE.PointLight(0xfff0d0, 2.8, 5000, 1.5);
sunLight.position.set(-1800, 1000, -EARTHZ+1600);
scene.add(sunLight);
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(80,32,32), new THREE.MeshBasicMaterial({color:0xfff4e0}));
sunMesh.position.copy(sunLight.position); scene.add(sunMesh);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(45,90,90,0.45),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
sunGlow.scale.set(600,600,1); sunGlow.position.copy(sunLight.position); scene.add(sunGlow);

// ===== CAMERA SHAKE =====
let shakeIntensity = 0;
const shakeDecay = 0.92;
let shakeOffsetX = 0, shakeOffsetY = 0;
function triggerShake(intensity){ shakeIntensity = Math.max(shakeIntensity, intensity); }

// ===== CONTROLS =====
let velocity = 0;
const MAX_VELOCITY = 700;
const FRICTION = 0.988;

window.addEventListener('wheel', (e)=>{
  const prev = velocity;
  velocity += e.deltaY * 1.7;
  velocity = Math.max(-260, Math.min(MAX_VELOCITY, velocity));
  const dv = Math.abs(velocity - prev);
  if(dv > 15) triggerShake(Math.min(3, dv * 0.015));
}, {passive:true});

let touchY = null;
window.addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchmove', e=>{
  if(touchY!==null){
    const y = e.touches[0].clientY;
    const prev = velocity;
    velocity += (touchY - y) * 5.5;
    velocity = Math.max(-260, Math.min(MAX_VELOCITY, velocity));
    const dv = Math.abs(velocity - prev);
    if(dv > 20) triggerShake(Math.min(3, dv * 0.01));
    touchY = y;
  }
}, {passive:true});

window.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key===' ') velocity = Math.min(MAX_VELOCITY, velocity+160);
  if(e.key==='ArrowUp') velocity = Math.max(-260, velocity-160);
  triggerShake(1.5);
});

let mouseX=0, mouseY=0;
window.addEventListener('mousemove', e=>{
  mouseX = (e.clientX/window.innerWidth - 0.5);
  mouseY = (e.clientY/window.innerHeight - 0.5);
});

// ===== CINEMATIC FX =====
function drawCinematicFX(speedNorm, t){
  fxCtx.clearRect(0,0,fx.width,fx.height);
  const cx = fx.width/2, cy = fx.height/2;
  if(speedNorm > 0.015){
    const n = Math.floor(speedNorm * 70);
    fxCtx.save();
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const r0 = 30+Math.random()*50;
      const r1 = r0 + 100 + speedNorm*450;
      const bs = Math.min(1, speedNorm*1.2);
      const a = (0.15+speedNorm*0.35) * (0.2+Math.random()*0.8);
      fxCtx.strokeStyle = `rgba(${Math.floor(200-bs*80)},${Math.floor(215-bs*60)},${Math.floor(220+bs*35)},${a})`;
      fxCtx.lineWidth = 0.3+Math.random()*1.2*(1-speedNorm*0.4);
      fxCtx.beginPath();
      fxCtx.moveTo(cx+Math.cos(ang)*r0, cy+Math.sin(ang)*r0);
      fxCtx.lineTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
      fxCtx.stroke();
    }
    if(speedNorm > 0.4){
      const ca = (speedNorm-0.4)*0.12;
      fxCtx.globalCompositeOperation = 'lighter';
      fxCtx.fillStyle = `rgba(255,50,50,${ca*0.3})`;
      fxCtx.fillRect(0,0,3,fx.height);
      fxCtx.fillRect(fx.width-3,0,3,fx.height);
      fxCtx.fillStyle = `rgba(50,50,255,${ca*0.3})`;
      fxCtx.fillRect(fx.width-3,0,3,fx.height);
      fxCtx.fillRect(0,0,3,fx.height);
      fxCtx.globalCompositeOperation = 'source-over';
    }
    fxCtx.restore();
  }
  const vigStr = 0.35+speedNorm*0.45;
  const g = fxCtx.createRadialGradient(cx,cy,fx.height*0.2, cx,cy, fx.height*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.6,`rgba(0,0,0,${vigStr*0.3})`);
  g.addColorStop(1,`rgba(0,0,0,${vigStr})`);
  fxCtx.fillStyle = g; fxCtx.fillRect(0,0,fx.width,fx.height);
  if(speedNorm > 0.25){ fxCtx.fillStyle = `rgba(30,60,160,${(speedNorm-0.25)*0.06})`; fxCtx.fillRect(0,0,fx.width,fx.height); }
  fxCtx.globalAlpha = 0.035;
  for(let i=0;i<1200;i++){
    const v = Math.random()*255;
    fxCtx.fillStyle = `rgb(${v},${v},${v})`;
    fxCtx.fillRect(Math.random()*fx.width,Math.random()*fx.height,1,1);
  }
  fxCtx.globalAlpha = 1;
  if(speedNorm > 0.1){
    const fa = speedNorm*0.08;
    const fg = fxCtx.createLinearGradient(cx-fx.width*0.4,cy,cx+fx.width*0.4,cy);
    fg.addColorStop(0,'rgba(0,0,0,0)');
    fg.addColorStop(0.3,`rgba(180,200,255,${fa*0.3})`);
    fg.addColorStop(0.5,`rgba(220,235,255,${fa})`);
    fg.addColorStop(0.7,`rgba(180,200,255,${fa*0.3})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    fxCtx.fillStyle = fg; fxCtx.fillRect(0,cy-1,fx.width,2);
  }
}

// ===== ANIMATE =====
let depth = 0, t = 0;
function animate(){
  t += 0.016;
  velocity *= FRICTION;
  depth += velocity * 0.016;
  depth = Math.max(0, depth);
  if(depth >= MAX_DEPTH){ depth = MAX_DEPTH; if(velocity>0) velocity = 0; }
  const camZ = -depth;
  const speedNorm = Math.min(1, Math.abs(velocity)/MAX_VELOCITY);

  // Shake
  if(shakeIntensity > 0.01){
    shakeOffsetX = (Math.random()-0.5) * shakeIntensity;
    shakeOffsetY = (Math.random()-0.5) * shakeIntensity;
    shakeIntensity *= shakeDecay;
  } else { shakeOffsetX=0; shakeOffsetY=0; shakeIntensity=0; }

  const speedWobble = speedNorm > 0.3 ? Math.sin(t*8)*speedNorm*1.5 : 0;
  camera.fov = BASE_FOV + speedNorm*22 + speedWobble;
  camera.updateProjectionMatrix();

  const targetX = Math.sin(t*0.11)*4 + mouseX*12 + shakeOffsetX;
  const targetY = Math.cos(t*0.08)*3 + mouseY*7 + shakeOffsetY;
  camera.position.z = camZ;
  camera.position.x += (targetX - camera.position.x)*0.04;
  camera.position.y += (targetY - camera.position.y)*0.04;
  camera.rotation.z += ((Math.sin(t*0.06)*0.012 - speedNorm*0.008 + shakeIntensity*0.005*(Math.random()-0.5)) - camera.rotation.z)*0.1;
  camera.lookAt(camera.position.x*0.3, camera.position.y*0.3, camZ - 250);

  torch.position.copy(camera.position);
  torch.position.z -= 18;

  earthMesh.rotation.y += 0.0008;
  cloudsMesh.rotation.y += 0.0013;
  moonOrbit.position.x = EARTH_RADIUS*2.8+Math.sin(t*0.05)*50;
  moonOrbit.position.z = -EARTH_RADIUS*1.5+Math.cos(t*0.05)*50;

  for(const layer of starLayers){
    layer.material.opacity = layer.userData.baseOpacity * (0.88 + 0.12*Math.sin(t*1.2+layer.userData.id));
  }

  // Animate tunnel star fields — stars swirl when camera passes through
  for(const ts of tunnelStarFields){
    const posArr = ts.points.geometry.attributes.position.array;
    for(let i = 0; i < ts.count; i++){
      // Rotate each star around Z axis (tunnel axis)
      const x = posArr[i*3];
      const y = posArr[i*3+1];
      const angle = 0.015;
      posArr[i*3] = x * Math.cos(angle) - y * Math.sin(angle);
      posArr[i*3+1] = x * Math.sin(angle) + y * Math.cos(angle);
    }
    ts.points.geometry.attributes.position.needsUpdate = true;
  }

  // Rotate spiral energy streams
  for(const sp of tunnelSpiralGroups){
    sp.group.rotation.z += sp.speed;
  }

  for(const c of comets){
    c.position.addScaledVector(c.userData.vel, 0.016);
    if(Math.abs(c.position.x)>1000) c.userData.vel.x *= -1;
    if(Math.abs(c.position.y)>600) c.userData.vel.y *= -1;
  }

  for(const a of allAsteroids){
    if(a.userData.spin instanceof THREE.Vector3){ a.rotation.x+=a.userData.spin.x; a.rotation.y+=a.userData.spin.y; a.rotation.z+=a.userData.spin.z; }
    if(a.userData.oS){
      a.userData.oA+=a.userData.oS;
      const oc=a.userData.oC,od=a.userData.oD;
      a.position.x=oc.x+Math.cos(a.userData.oA)*od;
      a.position.z=oc.z+Math.sin(a.userData.oA)*od;
      a.position.y=oc.y+Math.sin(a.userData.oA)*od*a.userData.oT;
    }
  }

  scene.traverse(obj=>{ if(obj.userData && typeof obj.userData.spin === 'number') obj.rotation.y += obj.userData.spin; });

  drawCinematicFX(speedNorm, t);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
