<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM SECURE TERMINAL</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020406;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    /* BÜTÜN FİLİQRAN VƏ LOQOLARI SİL */
    .leaflet-control-attribution,
    .leaflet-control-container,
    .leaflet-bottom,
    .leaflet-right,
    .leaflet-top,
    .leaflet-left,
    .esri-attribution-cloner,
    [class*="attribution"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
    }

    /* 1. TƏMİZ QR EKRANI */
    #qr-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .qr-card {
      padding: 18px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(0, 255, 136, 0.4);
      border: 2px solid #00ff88;
      transition: transform 0.3s ease;
    }

    .qr-card:hover {
      transform: scale(1.02);
    }

    /* 2. CRT MONİTOR SCANLINE EFFEKTİ */
    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      background-size: 100% 3px, 6px 100%;
      opacity: 0.8;
    }

    /* 3. TERMINAL EKRANI */
    #terminal {
      position: fixed;
      inset: 0;
      background: #030708;
      padding: 24px;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-all;
      z-index: 9000;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      color: #00ff88;
      text-shadow: 0 0 3px rgba(0, 255, 136, 0.7);
    }

    .c-green  { color: #00ff88; font-weight: bold; }
    .c-red    { color: #ff3355; font-weight: bold; }
    .c-yellow { color: #ffbb00; }
    .c-cyan   { color: #00e5ff; }
    .c-dim    { color: #446655; }
    .c-white  { color: #ffffff; font-weight: bold; }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 15px;
      background: #00ff88;
      animation: blink 0.7s infinite;
      vertical-align: middle;
      margin-left: 6px;
      box-shadow: 0 0 8px #00ff88;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 4. PEYK XƏRİTƏSİ */
    #map-wrapper {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 1000;
      background: #000;
      opacity: 0;
      transition: opacity 1.2s ease-in;
    }

    #map {
      width: 100vw;
      height: 100vh;
      filter: contrast(1.15) brightness(0.9) saturate(1.1);
    }

    /* HUD QATI */
    #hud-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5000;
      display: none;
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border: 1px dashed rgba(0, 255, 136, 0.4);
      border-radius: 50%;
      animation: rotateRing 20s linear infinite;
    }

    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0, 255, 136, 0.6);
    }
    .crosshair::before { top: 50%; left: -20px; width: 200px; height: 1px; }
    .crosshair::after  { left: 50%; top: -20px; height: 200px; width: 1px; }

    @keyframes rotateRing {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .telemetry-box {
      position: absolute;
      background: rgba(4, 12, 10, 0.85);
      border: 1px solid #00ff88;
      padding: 12px 18px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }
    .tl-top-left { top: 25px; left: 25px; }
    .tl-top-right { top: 25px; right: 25px; text-align: right; }

    /* Radar Nişangahı */
    .radar-container {
      position: relative;
      width: 40px;
      height: 40px;
    }

    .radar-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background-color: #ff2244;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff2244;
    }

    .radar-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 34, 68, 0.9);
      animation: pulseRipple 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    @keyframes pulseRipple {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(3.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <!-- Təmiz QR Ekranı -->
  <div id="qr-screen">
    <div class="qr-card">
      <div id="qrcode"></div>
    </div>
  </div>

  <!-- Kiber Terminal -->
  <div id="terminal">
    <div id="code-stream"></div>
  </div>

  <!-- HUD Qatı -->
  <div id="hud-layer">
    <div class="crosshair"></div>
    <div class="telemetry-box tl-top-left">
      <div>[SECTOR]: <span class="c-white">NEHREM / SCHOOL NO.3</span></div>
      <div>FREQUENCY: <span class="c-cyan">14.250 GHz (ENCRYPTED)</span></div>
      <div>STREAM: <span class="c-green">4K OPTICAL FEED</span></div>
    </div>
    <div class="telemetry-box tl-top-right">
      <div>TARGET STATUS: <span class="c-red">LOCKED</span></div>
      <div>ALTITUDE: <span class="c-white" id="alt-counter">540,000 M</span></div>
      <div>ORBIT SYNC: <span class="c-green">OPTIMAL</span></div>
    </div>
  </div>

  <!-- Peyk Xəritəsi -->
  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://axtarget.xyz",
      width: 220,
      height: 220,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    // ========================================================
    // DƏQİQ PEYK KOORDİNATI: NEHRƏM 3 SAYLI MƏKTƏBİN SAĞ HƏYƏTİ
    // ========================================================
    const TARGET_LAT = 39.12352; 
    const TARGET_LNG = 45.42284;

    const terminalLogs = [
      { text: "sys-operator@black-box:~$ ./kernel_exploit --stealth --sat-bypass", type: "c-white", pause: 450 },
      { text: "[*] Initializing memory payload in segment 0x7fff89a...", type: "c-dim" },
      { text: "[*] Overriding POSIX security flags... [OK]", type: "c-green" },
      { text: "[+] Exploiting CVE-2026-4419 (Local Privilege Escalation)...", type: "c-yellow" },
      { text: "[!] ROOT ACCESS GRANTED: uid=0(root) gid=0(root)", type: "c-green", pause: 400 },
      
      { text: "root@black-box:~# nmap -sS -T4 -Pn 192.168.10.0/24 -p 22,80,443,8080", type: "c-white", pause: 400 },
      { text: "Host discovery disabled (-Pn). Scanning 256 hosts...", type: "c-dim" },
      { text: "SYN Stealth Scan: Discovered open port 443/tcp on 192.168.10.14", type: "c-cyan" },
      { text: "SYN Stealth Scan: Discovered open port 8080/tcp on 192.168.10.89", type: "c-cyan" },
      { text: "[+] Nmap done: 1 IP address (1 host up) scanned in 0.42s", type: "c-green" },

      { text: "root@black-box:~# python3 sat_triangulate.py --target=NEHREM_SCH_3", type: "c-white", pause: 300 },
      { text: "[*] Establishing handshake with Geo-Orbital Constellation...", type: "c-yellow" },
      { text: "    [>..........] 14% Syncing azimuth / elevation", type: "c-dim", pause: 150 },
      { text: "    [=====>.....] 52% Handshake verified (RSA-8192 signature accepted)", type: "c-dim", pause: 180 },
      { text: "    [=========>.] 91% Bypassing local perimeter sensors...", type: "c-dim", pause: 200 },
      { text: "    [===========] 100% SATELLITE OPTICAL RELAY UNLOCKED", type: "c-green", pause: 350 },

      { text: "[!] INJECTING RAW PACKET STREAM: NMEA-0183 (GPGGA, GPRMC)", type: "c-red" },
      { text: ">>> $GPGGA,123519,3912.3520,N,04542.2840,E,1,08,0.9,862.0,M,42.1,M,,*51", type: "c-cyan" },
      { text: ">>> $GPRMC,123519,A,3912.3520,N,04542.2840,E,000.0,000.0,230326,003.1,W*78", type: "c-cyan" },
      
      { text: "[*] LATITUDE RESOLVED  : 39° 07' 24.6\" N", type: "c-white" },
      { text: "[*] LONGITUDE RESOLVED : 45° 25' 22.2\" E", type: "c-white" },
      { text: "[*] TARGET CONFIRMED   : NEHREM / SCHOOL NO.3 (EAST WING)", type: "c-cyan" },
      { text: "[+] TARGET LOCK ACHIEVED. ACTIVATING HIGH-ALTITUDE RECON SCAN...", type: "c-green", pause: 500 }
    ];

    let started = false;
    let logIndex = 0;
    const qrScreen = document.getElementById("qr-screen");
    const terminal = document.getElementById("terminal");
    const codeStream = document.getElementById("code-stream");
    const mapWrapper = document.getElementById("map-wrapper");
    const hudLayer = document.getElementById("hud-layer");
    const altCounter = document.getElementById("alt-counter");

    function generateRawHex(lineCount = 25) {
      const hexChars = "0123456789ABCDEF";
      for (let i = 0; i < lineCount; i++) {
        let mem = "0x" + Math.random().toString(16).substr(2, 8).toUpperCase() + "  ";
        for (let b = 0; b < 8; b++) {
          mem += hexChars[Math.floor(Math.random() * 16)] + hexChars[Math.floor(Math.random() * 16)] + " ";
        }
        mem += " |" + Math.random().toString(36).substr(2, 8) + "|";
        
        const row = document.createElement("div");
        row.className = "c-dim";
        row.innerText = mem;
        codeStream.appendChild(row);
      }
    }

    function runHackerFlow() {
      if (started) return;
      started = true;

      qrScreen.style.display = "none";
      terminal.style.display = "flex";

      function printNext() {
        if (logIndex >= terminalLogs.length) {
          generateRawHex(35);
          terminal.scrollTop = terminal.scrollHeight;
          
          setTimeout(launchSatelliteTransition, 700);
          return;
        }

        const log = terminalLogs[logIndex];
        const row = document.createElement("div");
        row.className = log.type || "c-green";
        row.innerText = log.text;
        codeStream.appendChild(row);

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        codeStream.appendChild(cursor);

        terminal.scrollTop = terminal.scrollHeight;

        const cursors = document.querySelectorAll('.cursor');
        if (cursors.length > 1) cursors[0].remove();

        logIndex++;
        const nextDelay = log.pause || (20 + Math.random() * 35);
        setTimeout(printNext, nextDelay);
      }

      printNext();
    }

    function launchSatelliteTransition() {
      terminal.style.display = "none";
      mapWrapper.style.display = "block";
      hudLayer.style.display = "block";

      setTimeout(() => { mapWrapper.style.opacity = "1"; }, 50);

      // Başlanğıc: Uzaq stratosfer
      const map = L.map('map', {
        attributionControl: false,
        zoomControl: false,
        boxZoom: false,
        doubleClickZoom: false,
        keyboard: false
      }).setView([TARGET_LAT + 6, TARGET_LNG - 10], 5);

      // 100% Filiqransız ESRI Peyk Xəritəsi
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
      }).addTo(map);

      // Dəqiq radar nişangahı
      const radarPin = L.divIcon({
        className: 'custom-radar',
        html: `
          <div class="radar-container">
            <div class="radar-ring"></div>
            <div class="radar-core"></div>
          </div>
        `,
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      });

      L.marker([TARGET_LAT, TARGET_LNG], { icon: radarPin }).addTo(map);

      // Ekran ölçülərini dərhal kalibrləyib uçuşu başladırıq
      setTimeout(() => {
        map.invalidateSize();
        
        map.flyTo([TARGET_LAT, TARGET_LNG], 18, {
          animate: true,
          duration: 3.5,
          easeLinearity: 0.25
        });

        let alt = 540000;
        const altInterval = setInterval(() => {
          alt = Math.max(862, Math.floor(alt * 0.82));
          altCounter.innerText = alt.toLocaleString() + " M";
          if (alt <= 875) clearInterval(altInterval);
        }, 120);
      }, 500);
    }

    window.addEventListener("click", runHackerFlow);
    window.addEventListener("touchstart", runHackerFlow);
  </script>
</body>
</html>
