<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxtarGet :: Konum Tapıldı</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --green:#00ff41;
    --dim:#0a6b1f;
    --bg:#000000;
  }
  html,body{margin:0;padding:0;height:100%;background:var(--bg);
    font-family: Consolas, monospace; color:var(--green); overflow:hidden;}

  #boot{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); gap:14px; text-align:center; padding:20px;
  }
  #boot h1{font-size:1.6em; letter-spacing:2px; margin:0;}
  #boot .line{color:var(--dim); font-size:.95em;}
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:3px solid var(--dim); border-top-color:var(--green);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .bar{width:260px;height:6px;background:#031a06;border:1px solid var(--dim);overflow:hidden;}
  .bar > div{height:100%;width:0%;background:var(--green);transition:width .3s linear;}

  #map{position:fixed; inset:0; z-index:1; opacity:0; transition:opacity .6s ease;}
  #map.show{opacity:1;}

  #spacePrompt{
    position:fixed; inset:0; z-index:15;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); gap:10px; text-align:center;
  }
  #spacePrompt .key{
    border:2px solid var(--green); padding:10px 26px; border-radius:6px;
    font-size:1.1em; letter-spacing:3px; animation:blink 1.1s step-start infinite;
  }
  @keyframes blink{50%{opacity:.25;}}
  #spacePrompt .hint{color:var(--dim); font-size:.85em;}

  #flood{
    position:fixed; inset:0; z-index:16; background:var(--bg);
    font-size:12px; line-height:1.25em; white-space:pre; overflow:hidden;
    padding:8px; display:none;
  }
  #flood .col{color:var(--dim);}
  #flood .hi{color:var(--green); text-shadow:0 0 4px rgba(0,255,65,.6);}

  #hud{
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:12px 16px; background:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,0));
    display:flex; justify-content:space-between; align-items:flex-start;
    font-size:.85em; pointer-events:none;
  }
  #hud .box{color:var(--green); text-shadow:0 0 6px rgba(0,255,65,.5);}
  #hud .dim{color:var(--dim);}

  .leaflet-container{background:#020a02 !important;}
  .pulse-wrap{position:relative;}
  .pulse-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--green); box-shadow:0 0 10px var(--green);
    border:2px solid #000;
  }
  .pulse-ring{
    position:absolute; left:50%; top:50%;
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--green);
    transform:translate(-50%,-50%);
    animation:pulse 1.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{width:14px;height:14px;opacity:.9;}
    100%{width:70px;height:70px;opacity:0;}
  }
</style>
</head>
<body>

<div id="boot">
  <h1>AxtarGet // GEOLOCATE</h1>
  <div class="spinner"></div>
  <div class="line" id="bootStatus">GPS moduluna qoşulur...</div>
  <div class="bar"><div id="bootBar"></div></div>
</div>

<div id="spacePrompt">
  <h1 style="font-size:1.4em;">AxtarGet // TRACE HAZIRDIR</h1>
  <div class="key">SPACE</div>
  <div class="hint">İzləməni başlatmaq üçün boşluq düyməsinə basın</div>
</div>

<pre id="flood"></pre>

<div id="hud" style="display:none;">
  <div class="box">
    ● KONUM TAPILDI<br>
    <span class="dim" id="coordText">--</span><br>
    <span class="dim">Dəqiqlik: <span id="accText">--</span> m</span>
  </div>
  <div class="box" style="text-align:right;">
    AxtarGet v1.4<br>
    <span class="dim" id="clock">--:--:--</span>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ------------------------------------------------------------------
  // SAXTA KOORDİNAT ÜRETİMİ (istəsən sabit dəyərlərlə əvəz et)
  // ------------------------------------------------------------------
  function fakeCoord(){
    // Nümunə: Bakı ətrafında təsadüfi nöqtə. İstədiyin şəhər/ölkəyə uyğunlaşdıra bilərsən.
    const baseLat = 40.4093, baseLng = 49.8671; // Bakı mərkəzi
    const lat = baseLat + (Math.random()-0.5)*0.08;
    const lng = baseLng + (Math.random()-0.5)*0.08;
    return {lat, lng};
  }

  const target = fakeCoord();
  const accuracy = Math.floor(8 + Math.random()*30); // saxta dəqiqlik (metr)

  // ------------------------------------------------------------------
  // 1) SPACE gözlənilir
  // ------------------------------------------------------------------
  document.getElementById("boot").style.display = "none";

  let started = false;
  function onKey(e){
    if(e.code === "Space" && !started){
      started = true;
      window.removeEventListener("keydown", onKey);
      document.getElementById("spacePrompt").style.display = "none";
      startFlood();
    }
  }
  window.addEventListener("keydown", onKey);
  // Mobil/toxunma ekranlar üçün: ekrana toxunanda da başlasın
  document.getElementById("spacePrompt").addEventListener("click", ()=>{
    if(!started){ started = true; window.removeEventListener("keydown", onKey);
      document.getElementById("spacePrompt").style.display="none"; startFlood(); }
  });

  // ------------------------------------------------------------------
  // 2) KOD AXINI (matrix-tərzi saxta sətirlər)
  // ------------------------------------------------------------------
  const floodEl = document.getElementById("flood");
  const hexChars = "0123456789ABCDEF";
  const codeWords = [
    "INIT_TRACE","SOCKET_BIND","PACKET_SNIFF","AES_DECRYPT","ROUTE_HOP",
    "DNS_RESOLVE","HANDSHAKE_OK","PING_ECHO","CELL_TOWER_ID","IMSI_CATCH",
    "TRIANGULATE","SIGNAL_LOCK","BUFFER_FLUSH","NODE_SYNC","PROXY_CHAIN",
    "GPS_STREAM","LAT_LNG_CALC","ENCRYPT_TUNNEL","MAC_SPOOF","EXPLOIT_LOAD"
  ];
  function randHex(len){
    let s="";
    for(let k=0;k<len;k++) s+=hexChars[Math.floor(Math.random()*16)];
    return s;
  }
  function randCodeLine(){
    const word = codeWords[Math.floor(Math.random()*codeWords.length)];
    const addr = "0x"+randHex(8);
    const val  = randHex(16);
    const pct  = Math.floor(Math.random()*100);
    return `[${addr}] ${word.padEnd(16,' ')} :: ${val}  (${pct}%)`;
  }

  let floodInterval;
  let floodElapsed = 0;
  const FLOOD_DURATION = 2600; // ms - istəsən uzat/qısalt

  function startFlood(){
    floodEl.style.display = "block";
    floodEl.textContent = "";
    const startTime = Date.now();

    floodInterval = setInterval(()=>{
      // Bir dəfəyə bir neçə sətir əlavə et (sürətli axın effekti)
      let chunk = "";
      const linesThisTick = 3;
      for(let k=0;k<linesThisTick;k++){
        const hi = Math.random() > 0.75;
        const line = randCodeLine();
        chunk += line + "\n";
      }
      floodEl.textContent += chunk;
      floodEl.scrollTop = floodEl.scrollHeight;

      // Ekranda çox sətir yığılmasın deyə köhnələri təmizlə
      const allLines = floodEl.textContent.split("\n");
      if(allLines.length > 300){
        floodEl.textContent = allLines.slice(-200).join("\n");
      }

      floodElapsed = Date.now() - startTime;
      if(floodElapsed >= FLOOD_DURATION){
        clearInterval(floodInterval);
        finishFlood();
      }
    }, 30);
  }

  function finishFlood(){
    floodEl.style.display = "none";
    document.getElementById("boot").style.display = "flex";
    nextBootLine();
  }

  // ------------------------------------------------------------------
  // 3) GPS BOOT SƏTİRLƏRİ (əvvəlki animasiya - kod axınından sonra)
  // ------------------------------------------------------------------
  const bootLines = [
    "GPS moduluna qoşulur...",
    "Peyk siqnalları axtarılır...",
    "Trianqulyasiya aparılır...",
    "Şəbəkə metadatası oxunur...",
    "Koordinatlar hesablanır..."
  ];
  let i = 0;
  const bootStatus = document.getElementById("bootStatus");
  const bootBar = document.getElementById("bootBar");

  function nextBootLine(){
    if(i < bootLines.length){
      bootStatus.textContent = bootLines[i];
      bootBar.style.width = Math.round(((i+1)/bootLines.length)*100) + "%";
      i++;
      setTimeout(nextBootLine, 500 + Math.random()*400);
    } else {
      setTimeout(revealMap, 400);
    }
  }

  function revealMap(){
    document.getElementById("boot").style.display = "none";
    document.getElementById("hud").style.display = "flex";

    document.getElementById("coordText").textContent =
      target.lat.toFixed(6) + ", " + target.lng.toFixed(6);
    document.getElementById("accText").textContent = accuracy;

    const map = L.map('map', {zoomControl:false, attributionControl:true})
      .setView([target.lat, target.lng], 15);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const icon = L.divIcon({
      className: '',
      html: '<div class="pulse-wrap"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>',
      iconSize: [14,14],
    });
    L.marker([target.lat, target.lng], {icon}).addTo(map);
    L.circle([target.lat, target.lng], {
      radius: accuracy, color:'#00ff41', weight:1, fillColor:'#00ff41', fillOpacity:0.08
    }).addTo(map);

    document.getElementById("map").classList.add("show");
  }

  // Saat
  function tick(){
    const d = new Date();
    document.getElementById("clock").textContent = d.toLocaleTimeString();
  }
  setInterval(tick, 1000); tick();
</script>
</body>
</html>
